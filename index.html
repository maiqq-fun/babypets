<style>
:root{--ink:#5a4030;--soft:#9a8270;--cream:#fffaee;--line:#efe1cc;--wood:#b98d62;--accent:#ff9a6b;--accent-d:#e07a4c;--night:#2b2b38;--danger:#d9534f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--night);font-family:"Huninn","PingFang TC","Noto Sans TC",sans-serif;color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stage{position:relative;width:100%;max-width:520px;margin:0 auto;overflow:hidden;user-select:none;-webkit-user-select:none}
.island{aspect-ratio:1024/2076;max-width:min(520px,calc((100lvh - env(safe-area-inset-top)) * 1024 / 2076));background:#a9def0}
.home{aspect-ratio:2/3;background:#f3dcc0;container-type:inline-size}
.hidden{display:none!important}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.island .bg{opacity:0;transition:opacity 1.2s ease}
.island .bg.on{opacity:1}
.thing{position:absolute;transform:translate(-50%,-100%);cursor:pointer;transition:transform .15s}
.thing img{display:block;width:100%;height:auto;pointer-events:none}
.thing:active{transform:translate(-50%,-100%) scale(.94)}
.thing.pick{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{filter:drop-shadow(0 0 0 #fff)}50%{filter:drop-shadow(0 0 10px #fff) brightness(1.15)}}
.label{position:absolute;transform:translate(-50%,0);white-space:nowrap;pointer-events:none;
  font-size:clamp(10px,2.7vw,13px);padding:2px 9px;border-radius:999px;background:rgba(255,250,238,.93);
  border:1.5px solid var(--wood);color:#6b4b33;box-shadow:0 1px 0 rgba(0,0,0,.12)}
.label.mine{background:#fff0e6;border-color:var(--accent);color:#b4532a}
.label.lot{background:rgba(255,255,255,.85);border-style:dashed;color:#7a5a40;padding:0;width:1.9em;height:1.9em;display:flex;align-items:center;justify-content:center;font-size:clamp(13px,3.6vw,17px)}
.bubble{position:absolute;transform:translate(-50%,-100%);font-size:clamp(14px,4.4vw,22px);background:#fff;border-radius:50%;
  width:2em;height:2em;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 rgba(0,0,0,.15);
  animation:bob 1.8s ease-in-out infinite;pointer-events:none}
.bubble::after{content:"";position:absolute;bottom:-5px;left:50%;margin-left:-5px;border:5px solid transparent;border-top-color:#fff;border-bottom:0}
@keyframes bob{0%,100%{margin-top:0}50%{margin-top:-5px}}
.top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;pointer-events:none;z-index:3000}
.top>*{pointer-events:auto}
.title{font-size:clamp(26px,8vw,38px);color:#fff;letter-spacing:3px;pointer-events:none!important;
  text-shadow:-2px -2px 0 #8a5a3a,2px -2px 0 #8a5a3a,-2px 2px 0 #8a5a3a,2px 2px 0 #8a5a3a,0 4px 0 #8a5a3a}
.topright{display:flex;gap:10px;align-items:center}
.logo{width:40%;max-width:210px;height:auto;pointer-events:none!important;filter:drop-shadow(0 3px 2px rgba(60,35,15,.35))}
.circle{position:relative;width:46px;height:46px;border-radius:50%;background:#fff6e6;border:3px solid #fff;box-shadow:0 0 0 2px var(--wood);
  display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden;padding:0}
.circle img{width:100%;height:100%;object-fit:cover;border-radius:50%}
#tix,#bell,#me{overflow:visible}
.circle{width:42px;height:42px;font-size:20px}
.badge{position:absolute;right:-6px;top:-6px;min-width:20px;height:20px;border-radius:10px;background:#ff5e5e;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;padding:0 4px;z-index:2}
.ticker{position:absolute;left:14px;right:14px;bottom:8.6%;z-index:3000;background:rgba(255,250,238,.92);border:1.5px solid var(--wood);border-radius:999px;
  padding:4px 12px;font-size:clamp(11px,3.1vw,13px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.12);transition:opacity .3s}
.pickbar{position:absolute;left:50%;bottom:9.5%;transform:translateX(-50%);z-index:3001;background:var(--accent);color:#fff;border-radius:14px;padding:8px 14px;font-size:14px;display:flex;gap:10px;align-items:center;white-space:nowrap;box-shadow:0 3px 0 var(--accent-d)}
.pickbar button{border:0;background:rgba(255,255,255,.25);color:#fff;border-radius:10px;padding:3px 10px}
.bar{position:absolute;left:50%;bottom:2.2%;transform:translateX(-50%);display:flex;gap:4px;background:rgba(255,250,238,.92);
  padding:4px;border-radius:999px;box-shadow:0 2px 0 rgba(0,0,0,.15);z-index:3000}
.bar button{border:0;background:transparent;color:#7a5a40;font-size:13px;padding:6px 10px;border-radius:999px;white-space:nowrap}
.bar button.on{background:var(--accent);color:#fff}
/* home */
.pill{border:2px solid var(--wood);background:rgba(255,250,238,.94);border-radius:999px;padding:6px 14px;font-size:15px;box-shadow:0 2px 0 rgba(0,0,0,.12);white-space:nowrap}
.housename{font-size:clamp(15px,4.4vw,19px);padding:6px 14px;max-width:48%;overflow:hidden;text-overflow:ellipsis;text-align:center}
.pet{position:absolute;transform-origin:50% 100%;cursor:pointer}
.pet .body{display:block;transform-origin:50% 100%}
.pet img{display:block;width:100%;height:auto;pointer-events:none}
.pet .emoji{display:block;text-align:center;line-height:1;pointer-events:none}
.pet .shadow{position:absolute;left:12%;right:12%;bottom:-4%;height:12%;border-radius:50%;background:rgba(90,55,25,.22);filter:blur(3px);z-index:-1}
.pet .nm{position:absolute;left:50%;bottom:-1.6em;transform:translateX(-50%);font-size:clamp(10px,2.6cqw,13px);background:rgba(255,250,238,.85);border-radius:999px;padding:0 7px;white-space:nowrap;pointer-events:none}
.poop{position:absolute;transform:translate(-50%,-100%);font-size:clamp(22px,7vw,34px);cursor:pointer;line-height:1;padding:6px;border:0;background:transparent;filter:drop-shadow(0 3px 2px rgba(90,55,25,.3))}
.bowl{position:absolute;transform:translate(-50%,-100%);font-size:clamp(26px,8vw,40px);line-height:1;filter:drop-shadow(0 3px 2px rgba(90,55,25,.3))}
.fx img{width:clamp(28px,9vw,44px);height:auto;display:block}.tent .zz i img{width:clamp(14px,4.5cqw,24px);display:block}
.ii.ic{width:1.3em;height:1.3em;font-size:1em;vertical-align:-.28em;margin:0 .05em}.circle .ii.ic{width:26px;height:26px}.act .ii.ic{width:1.45em;height:1.45em}
.fx{position:absolute;pointer-events:none;font-size:clamp(16px,5vw,24px);animation:float 1.3s ease-out forwards;z-index:2500}
@keyframes float{0%{opacity:0;transform:translate(-50%,0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-70px) scale(1.15)}}
.board{position:absolute;display:grid;grid-template-columns:repeat(3,1fr);gap:4%;padding:3%}
.note{aspect-ratio:1;border:0;padding:6%;font-size:clamp(8px,2.2vw,11px);line-height:1.25;text-align:left;overflow:hidden;
  box-shadow:0 2px 3px rgba(0,0,0,.18);color:#5a4030;display:flex;flex-direction:column;justify-content:space-between}
.note small{font-size:.85em;opacity:.7;text-align:right}
.note.empty{background:transparent!important;box-shadow:none;border:1.5px dashed rgba(122,90,64,.45);color:#8a6a50;align-items:center;justify-content:center;font-size:clamp(12px,3.4vw,16px)}
.empty-home{position:absolute;left:50%;top:72%;transform:translate(-50%,-50%);background:rgba(255,250,238,.95);border:2px dashed var(--wood);border-radius:18px;padding:14px 18px;text-align:center;font-size:15px;line-height:1.6;width:70%}
.empty-home button{margin-top:8px;border:0;background:var(--accent);color:#fff;border-radius:12px;padding:8px 14px}
.actions{position:absolute;left:50%;bottom:2.4%;transform:translateX(-50%);display:flex;gap:5px;z-index:3000}
.actions .act{padding:7px 9px;font-size:14px}
.act{border:2px solid var(--wood);background:rgba(255,250,238,.95);border-radius:18px;padding:8px 13px;font-size:15px;box-shadow:0 3px 0 rgba(0,0,0,.15);white-space:nowrap}
.act:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
.famtools{position:absolute;right:12px;top:62px;display:flex;flex-direction:column;gap:8px;z-index:3000}
.famtools .act{font-size:13px;padding:6px 10px}
.petmenu{position:absolute;transform:translate(-50%,-100%);display:flex;gap:6px;background:#fff;padding:6px;border-radius:16px;box-shadow:0 3px 0 rgba(0,0,0,.15);z-index:2800}
.petmenu button{border:0;background:#fff3e2;border-radius:12px;padding:7px 10px;font-size:14px;white-space:nowrap}
/* modal */
.modal{position:fixed;inset:0;background:rgba(40,25,15,.45);display:flex;align-items:flex-end;justify-content:center;z-index:5000}
.sheet{background:var(--sheetbg,var(--cream));width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px 24px}
@media(min-width:600px){.modal{align-items:center}.sheet{border-radius:24px}}
.sheet h3{margin:0 0 4px;font-weight:normal;font-size:20px;text-align:center;text-wrap:balance}
.sheet .lead{text-align:center;color:var(--soft);font-size:14px;margin:0 0 14px;line-height:1.6}
.field{margin-bottom:12px}
.field label,.flabel{display:block;font-size:13px;color:var(--soft);margin:0 0 5px 4px}
.field input,.field select,.field textarea{width:100%;font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
.field textarea{min-height:70px;resize:vertical}
.field input{min-width:0;max-width:100%}
.field input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-height:46px;line-height:22px;text-align:left}
.field input[type=date]::-webkit-date-and-time-value{text-align:left}
.two{display:flex;gap:10px}.two>.field{flex:1;min-width:0}
.hint{font-size:12px;color:#a08670;margin:4px 4px 0;line-height:1.5}
.choices{display:flex;flex-wrap:wrap;gap:6px}
.choices button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:7px 11px;font-size:15px}
.choices button.on{border-color:var(--accent);background:#fff0e8}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:38px;height:38px;border-radius:50%;border:0;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.swatches button.on{outline:3px solid var(--ink);outline-offset:2px}
.big3{display:grid;gap:10px;margin-top:6px}
.big3 button{display:flex;gap:12px;align-items:center;text-align:left;border:2px solid var(--line);background:#fff;border-radius:16px;padding:12px 14px;font-size:16px}
.big3 button .e{font-size:30px}
.big3 button small{display:block;color:var(--soft);font-size:12px;margin-top:2px}
.styles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.styles button{min-width:0;overflow:hidden;position:relative;border:2px solid var(--line);background:#fff;border-radius:12px;padding:4px;aspect-ratio:1}
.styles button img{display:block;width:100%;height:100%;min-width:0;object-fit:contain}
.styles button.on{border-color:var(--accent);background:#fff0e8;box-shadow:0 0 0 2px var(--accent)}
.styles button:disabled{opacity:.45;cursor:not-allowed}
.styles button:disabled::after{content:"已有人住";position:absolute;left:50%;bottom:3px;transform:translateX(-50%);font-size:10px;background:#7a6050;color:#fff;border-radius:8px;padding:1px 6px;white-space:nowrap}
.rooms{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rooms button{min-width:0;border:2px solid var(--line);background:#fff;border-radius:12px;padding:4px;display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--soft)}
.rooms button img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px}
.rooms button.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent);color:var(--ink)}
.steps{display:flex;justify-content:center;gap:6px;margin:6px 0 12px}
.steps i{width:22px;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--accent)}
.row2{display:flex;gap:10px;margin-top:10px}
.row2.sticky{position:sticky;bottom:-24px;margin:10px -16px -24px;padding:10px 16px 18px;background:var(--sheetbg,var(--cream));box-shadow:0 -6px 10px -8px rgba(90,60,30,.25);z-index:2}
.row2 button{flex:1;padding:12px;border-radius:14px;font-size:16px;border:2px solid var(--line);background:#fff}
.row2 .primary{background:var(--accent);border-color:var(--accent);color:#fff}
.row2 .primary:disabled{background:#d9cbbb;border-color:#d9cbbb}
.err{color:var(--danger);font-size:13px;min-height:18px;text-align:center;margin-top:4px}
.count{font-size:12px;color:var(--soft);text-align:right;margin-top:4px}
.photo{display:flex;gap:12px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px}
.photo .pv{width:72px;height:72px;flex:none;border-radius:12px;background:#f6ecdd;display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden}
.photo .pv.round{border-radius:50%}
.photo .pv img{width:100%;height:100%;object-fit:contain}
.photo .pv.round img{object-fit:cover;object-position:50% 15%}
.photo .pv.check{background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0 0/14px 14px}
.photo .info{flex:1;font-size:13px;color:var(--soft);line-height:1.5}
.photo .btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.photo .btns label,.photo .btns button{border:2px solid var(--line);background:#fffaf2;border-radius:10px;padding:5px 9px;font-size:13px;color:var(--ink);cursor:pointer}
.prompt{background:#fff;border:2px dashed var(--line);border-radius:12px;padding:10px;font-size:12px;line-height:1.6;white-space:pre-wrap;color:#6b5545;max-height:180px;overflow:auto;user-select:text;-webkit-user-select:text}
details{margin-top:6px}
details summary{font-size:13px;color:var(--accent-d);cursor:pointer}
.visits{position:absolute;left:12px;top:60px;z-index:2900;background:rgba(255,250,238,.9);border-radius:12px;padding:3px 10px;font-size:12px;white-space:nowrap;max-width:58%;overflow:hidden;text-overflow:ellipsis;box-shadow:0 1px 0 rgba(0,0,0,.1)}
.nightdim{position:absolute;inset:0;background:rgba(20,25,60,.38);opacity:0;transition:opacity 1s;pointer-events:none}
.nightdim.on{opacity:1}
.poop{width:clamp(30px,9cqw,46px)}.poop img{width:100%;display:block;pointer-events:none}
.bowl{width:clamp(56px,15cqw,80px)}.bowl img{width:100%;display:block}
.tent{position:absolute;cursor:pointer}
.tent>img{display:block;width:100%;transform-origin:50% 100%;animation:breathe 3.2s ease-in-out infinite;filter:drop-shadow(0 4px 3px rgba(90,55,25,.25))}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,1.045)}}
.tent .zz{position:absolute;left:58%;top:30%;pointer-events:none}
.tent .zz i{position:absolute;font-style:normal;color:#7a68c8;font-size:clamp(12px,3.4cqw,18px);opacity:0;animation:zz 3s linear infinite;text-shadow:0 1px 0 #fff}
.tent .zz i:nth-child(2){animation-delay:1s}.tent .zz i:nth-child(3){animation-delay:2s}
@keyframes zz{0%{opacity:0;transform:translate(0,0) scale(.7)}20%{opacity:1}100%{opacity:0;transform:translate(22px,-40px) scale(1.3)}}
.tent .flag{position:absolute;left:-4%;top:28%;width:28%;aspect-ratio:1;border-radius:50%;overflow:hidden;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tent .flag img{width:100%;height:100%;object-fit:cover}
.tent .nm{position:absolute;left:50%;bottom:-1.7em;transform:translateX(-50%);font-size:clamp(10px,2.6cqw,13px);background:rgba(255,250,238,.9);border-radius:999px;padding:0 8px;white-space:nowrap}
.petmenu{flex-direction:column;align-items:stretch;min-width:150px}
.pm-h{display:flex;align-items:center;gap:6px;font-size:14px;padding:0 2px}
.pm-h .tr{font-size:11px;background:#fff0e0;color:#b4532a;border-radius:8px;padding:1px 6px}
.pm-s{display:flex;align-items:center;gap:6px;font-size:12px;padding:0 2px}
.sbar{flex:1;height:7px;border-radius:4px;background:#f1e6d8;overflow:hidden}.sbar i{display:block;height:100%;border-radius:4px}
.pm-b{display:flex;gap:6px}
.nb{display:block;width:100%;text-align:left;border:0;border-radius:6px;padding:12px;margin-bottom:8px;font-size:15px;line-height:1.5;box-shadow:0 2px 3px rgba(0,0,0,.12);color:#5a4030}
.nb small{display:block;font-size:12px;opacity:.7;margin-top:4px}
.m small.st{color:var(--accent-d)}
.mini em{position:absolute;left:3px;bottom:3px;font-style:normal;font-size:10px;background:rgba(255,255,255,.9);border-radius:6px;padding:0 4px;color:#7a6050}
.gbtns{flex-wrap:wrap;justify-content:center}
@media (prefers-reduced-motion:reduce){.tent>img,.tent .zz i{animation:none}}

.coinpop{position:fixed;right:18px;top:64px;z-index:9600;background:#fff3c4;color:#8a5a00;border:2px solid #f0c44c;border-radius:999px;padding:3px 10px;font-size:14px;animation:cp 1.5s ease-out forwards;pointer-events:none}
@keyframes cp{0%{opacity:0;transform:translateY(8px)}15%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
.tk.coin{background:#fffaf0}.tk.coin button{background:#f0b429;box-shadow:0 3px 0 #c98f12}
details.earn{margin:-4px 0 12px}details.earn .frow{font-size:13px}
.frow{display:flex;justify-content:space-between;gap:10px;padding:9px 2px;border-bottom:1px dashed var(--line);font-size:14px;line-height:1.4}
.frow .ago{color:#a08670;font-size:12px;white-space:nowrap}
.frow.mine{background:#fff6e0;border-radius:8px;padding:9px 8px}
.flist{background:#fff;border:2px solid var(--line);border-radius:16px;padding:2px 10px;margin-top:8px}
.ticker .unread{display:inline-flex;min-width:18px;height:18px;border-radius:9px;background:#ff5e5e;color:#fff;font-size:11px;font-weight:normal;align-items:center;justify-content:center;padding:0 4px;margin-right:2px}
b.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff5e5e;margin-right:6px;vertical-align:1px}
.steps2{margin:4px 0 0;padding-left:22px;line-height:2;font-size:15px}
.sibs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px}
.sibs button{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid transparent;background:none;border-radius:14px;padding:4px;font-size:12px;color:var(--soft)}
.sibs button img{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.sibs button.on{border-color:var(--cc,var(--accent));color:var(--ink)}
.photos{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.photos button,.phadd{aspect-ratio:1;border-radius:10px;overflow:hidden;border:0;padding:0;background:#f6ecdd;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--soft);cursor:pointer}
.photos img{width:100%;height:100%;object-fit:cover}
.phadd{border:2px dashed var(--line)}
.chk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.chk span{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;background:#f4ece0;color:#b0a090}
.chk span.on{background:var(--cc,#ff9a6b);color:#fff}.chk span.today{box-shadow:0 0 0 2px var(--cc,#ff9a6b)}

      ${fld('p1','家人密碼',`<input id="p1" type="password" minlength="4" autocomplete="new-password">`,'至少 4 個字，只告訴家人就好')}
      ${fld('p2','再輸入一次',`<input id="p2" type="password" autocomplete="new-password">`)}
      <div class="err" id="perr"></div>
      <div class="row2"><button id="pb">上一步</button><button class="primary" id="b3">蓋好了！</button></div>`);

const RW=848,RH=1264,FLOOR={x0:110,x1:750,y0:840,y1:1170};
const BOARDS={basic1:[432,352,698,536],basic2:[422,335,710,547],basic3:[433,346,700,534],study:[456,286,689,486],garden:[428,255,680,479],cafe:[444,297,681,499],beach:[417,275,698,492],sakura:[435,270,701,507],forest:[432,266,690,492],cloud:[429,265,686,495],xmas:[433,269,689,505],ocean:[428,275,683,496],star:[425,248,690,507],space:[431,280,693,467]};

function spawnPoops(h){
  const n=petsOf(h.id).length;if(!n){h.poopAt=Date.now();return}
  const every=2*HOUR,k=Math.floor((Date.now()-(h.poopAt||Date.now()))/every)*n;
  for(let i=0;i<k&&h.poops.length<3*n;i++)h.poops.push({id:uid(),x:FLOOR.x0+60+Math.random()*(FLOOR.x1-FLOOR.x0-120),y:FLOOR.y0+60+Math.random()*(FLOOR.y1-FLOOR.y0-60)});
  if(k)h.poopAt=Date.now();save();
}
// ---------- 毛孩狀態 ----------
const TRAITS=['貪吃','愛睡','活潑','高冷','黏人'];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function hash01(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return ((h>>>0)%100000)/100000}
const TWO=8*HOUR;const twMin=t=>{const d=new Date(t+TWO);return d.getUTCHours()*60+d.getUTCMinutes()};
const twDay=t=>new Date(t+TWO).toISOString().slice(0,10);
function dayStart(t){const d=new Date(t+TWO);return t-(d.getUTCHours()*60+d.getUTCMinutes())*60000-d.getUTCSeconds()*1000-d.getUTCMilliseconds()}
function fullness(p,now){if(!p.lastFed)return 55;return clamp(Math.round(100-((now||Date.now())-p.lastFed)/HOUR*12.5),0,100)}
function mealsToday(p){return p.mealDay===todayTW()?(+p.meals||0):0}
function mood(p,h){const now=Date.now(),pats=(Array.isArray(p.pats)?p.pats:[]).filter(t=>now-t<3*HOUR).length;
  const vis=h.visits&&h.visits.day===todayTW()?(h.visits.list||[]).length:0;
  return clamp(35+15*Math.min(3,pats)+10*Math.min(2,vis)+8*Math.min(3,p.treatDay===todayTW()?(+p.treatN||0):0)+(fullness(p)>=50?10:-10)-10*Math.min(3,(h.poops||[]).length),0,100)}
// 睡覺：所有人看到的一樣（用毛孩 id ＋ 日期 ＋ 時段決定）
function sleepState(p,now){
  now=now||Date.now();if(p.wakeUntil&&now<+p.wakeUntil)return null;if(guestHere(p.id,now))return null;const m=twMin(now),ds=dayStart(now),day=twDay(now),id=p.id,lazy=p.trait==='愛睡',lively=p.trait==='活潑';
  const wake=ds+7*60*60000+Math.round(hash01(id+day+'w')*40)*60000;
  if(now<wake)return {label:'晚安',icon:'🌙',until:wake};
  if(m<9*60&&hash01(id+day+'bed')<(lazy?0.75:0.35)){const u=wake+(30+Math.round(hash01(id+day+'bd')*80))*60000;if(now<u)return {label:'賴床中',icon:'🛏️',until:u}}
  for(let b=10;b<24;b+=2){const p0=lazy?0.5:lively?0.15:0.28;if(hash01(id+day+'n'+b)>=p0)continue;
    const st=ds+b*HOUR+Math.round(hash01(id+day+'s'+b)*75)*60000,du=(20+Math.round(hash01(id+day+'d'+b)*20))*60000;
    if(now>=st&&now<st+du)return {label:(b>=12&&b<16)?'午覺':'美容覺',icon:(b>=12&&b<16)?'😴':'✨',until:st+du}}
  return null;
}
const isNight=()=>{const m=twMin(Date.now());return m>=23*60||m<6*60};
const guestHere=(pid,now)=>DB.houses.some(h=>(h.guests||[]).some(g=>g.petId===pid&&+g.until>(now||Date.now())));
function canEat(p){const f=fullness(p),n=mealsToday(p);if(sleepState(p))return 'sleep';if(n>=4)return 'max';if(p.lastFed&&Date.now()-p.lastFed<2*HOUR)return 'cool';if(f>=80)return 'full';return ''}

function renderBoard(){

// ---------- 動作 ----------
const ACTS={
  spin:{dur:1100,f:(t)=>({rot:t*720})},
  jump:{dur:1200,f:(t)=>({dy:-Math.abs(Math.sin(t*Math.PI*3))*40,sq:t%0.333<0.05?0.85:1})},
  stretch:{dur:1400,f:(t)=>{const k=Math.sin(t*Math.PI);return {sx:1+0.28*k,sq:1-0.18*k}}},
  roll:{dur:1500,f:(t)=>({rot:t<0.5?t*2*180:180+(t-0.5)*2*180,dy:-Math.sin(t*Math.PI)*12})},
  wiggle:{dur:1600,f:(t)=>({rot:Math.sin(t*Math.PI*6)*8})},
  dodge:{dur:600,f:(t)=>({dx:Math.sin(t*Math.PI)*60,dy:-Math.sin(t*Math.PI)*20})},
  pop:{dur:900,f:(t)=>({dy:-Math.sin(t*Math.PI)*70,sq:t<0.15?0.8:1})},
};
function actWeights(p){const t=p.trait;const mates=home?home.pets.filter(x=>x.id!==p.id&&x.el&&!x.sleep).length:0;const play=mates?(home.pets.some(x=>x.guest)?3:1):0;const toys=home&&(house(home.id).toys||[]).length?(t==='活潑'?3:1.5):0;return {play,toy:toys,walk:5,zoom:t==='活潑'?3:1,spin:t==='活潑'?2:1,jump:t==='活潑'?2:1,stretch:t==='愛睡'?3:1,roll:t==='黏人'?2:0.6,stare:t==='貪吃'?2:0.5}}
function pickAct(p){const w=actWeights(p),tot=Object.values(w).reduce((a,b)=>a+b,0);let x=Math.random()*tot;for(const k in w){if((x-=w[k])<0)return k}return 'walk'}
function startAnim(r,type){r.anim={type,t0:performance.now()}}
function placePet(r){
  if(!r.el)return;const p=pet(r.id);if(!p)return;
  if(r.sleep===undefined||Math.random()<0.01){const s=sleepState(p);const was=r.sleep;r.sleep=s;
    if(was&&!s){r.x=r.tent.x+40;r.y=r.tent.y+20;startAnim(r,'pop');r.state='idle';r.until=performance.now()+1200}}
  const asleep=!!r.sleep;r.el.style.display=asleep?'none':'';r.tentEl.style.display=asleep?'':'none';
  if(asleep){const lb=$('#tl_'+r.id);if(lb)lb.textContent=`${p.name}・${r.sleep.label} ${r.sleep.icon}`;return}
  const s=petScale(r.y),w=215*s;
  Object.assign(r.el.style,{left:((r.x-w/2)/RW*100)+'%',top:((r.y-w*(r.ar||1))/RH*100)+'%',width:(w/RW*100)+'%',zIndex:Math.round(r.y)});
  let dy=r.state==='walk'?-Math.abs(Math.sin(r.hop))*(r.fast?20:14)*s:0,dx=0,sq=r.state==='happy'?1+Math.sin(r.hop*2)*0.06:1,sx=1,rot=r.fast?r.facing*8:0;
  if(r.anim){const A=ACTS[r.anim.type],t=(performance.now()-r.anim.t0)/A.dur;if(t>=1)r.anim=null;else{const o=A.f(t);dy+=(o.dy||0)*s;dx+=(o.dx||0)*s;rot+=(o.rot||0)*r.facing;if(o.sq)sq=o.sq;if(o.sx)sx=o.sx}}
  const k=$('#home').clientHeight/RH;
  r.el.querySelector('.body').style.transform=`translate(${dx*k}px,${dy*k}px) rotate(${rot}deg) scaleX(${r.facing*sq*sx}) scaleY(${2-sq})`;
}
function tick(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  home.pets.forEach(r=>{if(!r.el)return;const p=pet(r.id);if(!p)return;
    if(r.sleep){placePet(r);return}
    if(r.state==='idle'&&now>r.until&&!r.anim){
      const hungry=fullness(p)<35&&!home.bowl;
      const a=hungry&&Math.random()<0.6?'stare':pickAct(p);
      if(a==='walk'||a==='zoom'){r.fast=a==='zoom';r.legs=a==='zoom'?3+Math.floor(Math.random()*3):1;r.tx=FLOOR.x0+Math.random()*(FLOOR.x1-FLOOR.x0);r.ty=FLOOR.y0+Math.random()*(FLOOR.y1-FLOOR.y0);r.state='walk'}
      else if(a==='play'){const others=home.pets.filter(x=>x!==r&&x.el&&!x.sleep);const o=others[Math.floor(Math.random()*others.length)];if(o){r.tgt=o;r.tx=o.x+(o.x>r.x?-90:90);r.ty=o.y;r.state='walk';r.goal='play';r.fast=Math.random()<0.5}else r.until=now+800}
      else if(a==='toy'){const T=(house(home.id).toys||[]);const t=T[Math.floor(Math.random()*T.length)];if(t){r.tx=t.x+(Math.random()<0.5?-60:60);r.ty=t.y;r.state='walk';r.goal='toy'}else{r.until=now+1000}}
      else if(a==='stare'){r.tx=BOWL.x+(Math.random()<0.5?-80:80);r.ty=BOWL.y-20;r.state='walk';r.goal='stare'}
      else{startAnim(r,a);r.until=now+ACTS[a].dur+800+Math.random()*1500}
    }
    if(r.state==='happy'&&now>r.until){r.state='idle';r.until=now+800}
    if(r.state==='walk'){const dx=r.tx-r.x,dy=r.ty-r.y,dist=Math.hypot(dx,dy),sp=(r.fast?330:110)*dt;if(Math.abs(dx)>2)r.facing=dx>0?1:-1;
      if(dist<=sp){r.x=r.tx;r.y=r.ty;
        if(r.goal==='eat'){r.goal=null;r.state='happy';r.until=now+2200;fx('❤️',r.x,r.y-160*petScale(r.y));sfx('eat');setTimeout(()=>petSay(r,'full'),1200);setTimeout(()=>fx('😋',r.x+30,r.y-170*petScale(r.y)),400)}
        else if(r.goal==='welcome'){r.goal=null;startAnim(r,'jump');r.state='idle';r.until=now+1500;fx('👋',r.x,r.y-170*petScale(r.y))}
        else if(r.goal==='play'){r.goal=null;r.fast=false;const o=r.tgt;r.facing=o&&o.x>r.x?1:-1;startAnim(r,'jump');r.state='idle';r.until=now+1800;if(o&&!o.sleep&&o.state!=='walk'){o.facing=-r.facing;startAnim(o,'jump');o.until=now+1800}fx('🎵',(r.x+(o?o.x:r.x))/2,r.y-180*petScale(r.y))}
        else if(r.goal==='toy'){r.goal=null;startAnim(r,Math.random()<0.5?'roll':'wiggle');r.state='idle';r.until=now+2200;const T=(house(home.id).toys||[]).sort((a,b)=>Math.hypot(a.x-r.x,a.y-r.y)-Math.hypot(b.x-r.x,b.y-r.y))[0];if(T)fx((ITEMS[T.item]||{}).emo||'✨',T.x,T.y-50)}
        else if(r.goal==='stare'){r.goal=null;r.facing=BOWL.x>r.x?1:-1;startAnim(r,'wiggle');r.state='idle';r.until=now+2500;fx('🍖？',r.x,r.y-170*petScale(r.y))}
        else if(r.fast&&--r.legs>0){r.tx=FLOOR.x0+Math.random()*(FLOOR.x1-FLOOR.x0);r.ty=FLOOR.y0+Math.random()*(FLOOR.y1-FLOOR.y0)}
        else{r.fast=false;r.state='idle';r.until=now+1500+Math.random()*3500}}
      else{r.x+=dx/dist*sp;r.y+=dy/dist*sp;r.hop+=dt*(r.fast?18:11)}}
    if(r.state==='happy')r.hop+=dt*9;placePet(r)});
  raf=requestAnimationFrame(tick);
}
const FXIMG={'💕':'heart','❤️':'heart','💖':'heart','✨':'star','🎉':'firework','🍖？':'question','🎵':'notes','💤':'z'};

const PROMPT_BODY=p=>`請參考我附的寵物照片，把牠畫成 3D 黏土質感的 Q 版遊戲角色，保留牠的毛色、花紋和特徵。${p.species?`（牠是一隻${p.species}${p.breed?'，品種是'+p.breed:''}）`:''}

【姿勢】

- 站姿，身體朝向畫面右邊、臉微微轉向前方（3/4 側面）

【背景（很重要）】

【規格】
- 正方形 1:1

- 不要任何文字`;
async function fileToImg(file){const url=URL.createObjectURL(file);try{return await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url})}finally{setTimeout(()=>URL.revokeObjectURL(url),1000)}}
async function makeHead(file){
  const img=await fileToImg(file);const side=Math.min(img.width,img.height),c=document.createElement('canvas');c.width=c.height=240;
  c.getContext('2d').drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,240,240);return c.toDataURL('image/jpeg',0.82);
}
async function makeBody(file){
  const img=await fileToImg(file);const W=Math.min(900,img.width),H=Math.round(img.height*W/img.width);
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.drawImage(img,0,0,W,H);
  const d=x.getImageData(0,0,W,H),a=d.data;
  // 判斷：已透明？綠底？其他底色？
  let tr=0,gr=0,cn=0;const corners=[[2,2],[W-3,2],[2,H-3],[W-3,H-3],[W>>1,2]];
  for(const [cx,cy] of corners){const i=(cy*W+cx)*4;cn++;if(a[i+3]<30)tr++;else if(a[i+1]>150&&a[i+1]-Math.max(a[i],a[i+2])>70)gr++}
  let mode='none';
  if(tr>=3)mode='alpha';else if(gr>=3){mode='green';
    for(let i=0;i<a.length;i+=4){const r=a[i],g=a[i+1],b=a[i+2],m=Math.max(r,b),k=(g-m)/255;
      let al=1-(k-0.12)/0.2;al=Math.max(0,Math.min(1,al));a[i+3]=Math.round(a[i+3]*al);if(g>m)a[i+1]=Math.min(g,m+6)}
    x.putImageData(d,0,0)}
  // 裁掉透明邊
  const d2=x.getImageData(0,0,W,H).data;let x0=W,y0=H,x1=0,y1=0;
  for(let yy=0;yy<H;yy+=2)for(let xx=0;xx<W;xx+=2){if(d2[(yy*W+xx)*4+3]>40){if(xx<x0)x0=xx;if(xx>x1)x1=xx;if(yy<y0)y0=yy;if(yy>y1)y1=yy}}
  if(x1<=x0||y1<=y0){x0=0;y0=0;x1=W-1;y1=H-1}
  const cw=x1-x0+1,ch=y1-y0+1,OW=420,OH=Math.round(ch*OW/cw),o=document.createElement('canvas');o.width=OW;o.height=OH;
  o.getContext('2d').drawImage(c,x0,y0,cw,ch,0,0,OW,OH);
  let url=o.toDataURL('image/webp',0.85);if(!url.startsWith('data:image/webp'))url=o.toDataURL('image/png');
  return {url,mode};
}

function sparkline(ws){
  ws=ws.slice().sort((a,b)=>a.date.localeCompare(b.date)).slice(-12);
  if(ws.length<2)return '';
  const W=300,H=90,P=16,v=ws.map(w=>w.kg),pad=Math.max(0.05,(Math.max(...v)-Math.min(...v))*0.2),mn=Math.min(...v)-pad,mx=Math.max(...v)+pad;
  const X=i=>P+(W-2*P)*i/(ws.length-1),Y=x=>H-P-(H-2*P)*(x-mn)/(mx-mn),L=ws.length-1;
  const d=ws.map((w,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(w.kg).toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="體重變化">
    <path d="${d} L${X(L)} ${H-P} L${X(0)} ${H-P} Z" style="fill:color-mix(in srgb,var(--cc,#ff9a6b) 22%,#fff)"/><path d="${d}" style="fill:none;stroke:var(--cc,#ff9a6b)" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="${X(L)}" cy="${Y(ws[L].kg)}" r="4" style="fill:var(--cc,#ff9a6b)"/>
    <text x="${X(0)}" y="${H-2}" font-size="10" fill="#a08670">${ws[0].date.slice(0,7)}</text><text x="${X(L)}" y="${H-2}" font-size="10" fill="#a08670" text-anchor="end">${ws[L].date.slice(0,7)}</text>
    <text x="${X(L)-6}" y="${Y(ws[L].kg)-8}" font-size="12" fill="#5a4030" text-anchor="end">${ws[L].kg} kg</text></svg>`;
}

  if(t.type==='check'){const set=new Set(logs.map(l=>l.date)),days=daysBack(14);let streak=0;for(let i=days.length-1;i>=0;i--){if(set.has(days[i]))streak++;else if(days[i]!==T)break}

  if(t.type==='count'){const days=daysBack(7),cnt=d=>logs.filter(l=>l.date===d).reduce((a,l)=>a+(+l.value||1),0),mx=Math.max(1,...days.map(cnt));
    body=`<div class="cnt"><b>${cnt(T)}</b><span>今天</span></div><div class="bars">${days.map(d=>`<span><i style="height:${cnt(d)/mx*100}%"></i><em>${+d.slice(8)}</em></span>`).join('')}</div>`}
  const act=!fam?`<span>${t.vis==='family'?'🔒 家人限定':'公開'}</span>`:t.type==='num'?`<button data-tadd="${t.id}">＋ 記錄</button>`:t.type==='check'?`<button data-tchk="${t.id}">${logs.some(l=>l.date===T)?'✅ 今天完成':'☐ 今天打勾'}</button>`:`<button data-tcnt="${t.id}">＋1 次</button>`;
  return `<div class="sec"><h4>${esc(t.icon||'📌')} ${esc(t.name)}${t.vis==='family'&&fam?' <small>🔒</small>':''} ${act}</h4>${body}</div>`;
}

const TREAT_MAX=3,TOY_MAX=8;
function itemIcon(id,cls){const it=ITEMS[id]||{emo:'❓'};return `<span class="ii ${cls||''}"><img src="assets/item_${id}.webp" alt="" onerror="this.remove()"><b>${it.emo}</b></span>`}
const bag=()=>DB.game.bag||(DB.game.bag={});

const bagList=kind=>Object.entries(bag()).filter(([id,n])=>n>0&&ITEMS[id]&&(!kind||ITEMS[id].kind===kind));

// ---------- 商店 ----------
let shopTab='treat';
function shopSheet(tab){
  if(!DB.me)return onboarding();if(tab)shopTab=tab;
  const g=DB.game,coins=g.coins||0,bd=DB.pets.some(p=>isBirthday(p.birthday));
  const tabs=[['treat','🍤 零食'],['toy','🧸 玩具'],['ticket','🎟️ 抽卡券'],['bag','🎒 背包']];
  let body='';
  if(shopTab==='treat'||shopTab==='toy'){
    const list=Object.entries(ITEMS).filter(([id,it])=>it.kind===shopTab&&!it.limited&&(!it.bday||bd));
    body=`<div class="shopgrid">${list.map(([id,it])=>`<div class="si">${itemIcon(id,'big')}<div class="sn">${it.name}</div>
      ${it.fav&&it.fav.length?`<div class="sf">${it.fav.join('、')}最愛</div>`:it.bday?'<div class="sf">今天有毛孩生日限定</div>':'<div class="sf">&nbsp;</div>'}
      <button data-buy="${id}" ${coins>=it.price?'':'disabled'}>🪙 ${it.price}</button><small>${bag()[id]?`背包裡有 ${bag()[id]}`:''}</small></div>`).join('')}</div>
      <div class="hint">${shopTab==='treat'?`零食可以去任何人家餵毛孩，每隻毛孩一天最多吃 ${TREAT_MAX} 個；也可以包成禮物送人`:'玩具可以擺在自己家，也可以送給朋友，會放在他們家的地上'}</div>`}
  if(shopTab==='ticket')body=`<div class="tk"><div><div style="font-size:13px;color:var(--soft)">抽卡券</div><div class="n">🎟️ ${g.tickets} 張</div></div><button data-ticket ${coins>=PACK_PRICE?'':'disabled'}>🪙 ${PACK_PRICE} 換 1 張</button></div><div class="hint">也可以完成任務拿券，點右上角的 🎟️ 看任務</div>`;
  if(shopTab==='bag'){const L=bagList();body=L.length?`<div class="shopgrid">${L.map(([id,n])=>`<div class="si">${itemIcon(id,'big')}<div class="sn">${ITEMS[id].name}</div><div class="sf">× ${n}</div></div>`).join('')}</div><div class="hint">零食：在別人家點毛孩 →「🍤 零食」。玩具：自己家點「🧸 玩具」擺出來，或在朋友家點「🎁 送禮」</div>`:'<div class="locked">背包是空的，買點東西吧</div>'}
  openModal(`<h3>🏪 毛毛商店</h3><p class="lead">我的金幣：<b class="coinv">🪙 ${coins}</b></p>
    <div class="tabs3">${tabs.map(([k,n])=>`<button data-tab="${k}" class="${k===shopTab?'on':''}">${n}</button>`).join('')}</div>${body}
    <div class="row2" style="margin-top:12px"><button data-close>關閉</button></div>`);
  const S=$('#sheet');
  S.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>shopSheet(b.dataset.tab));
  S.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const it=ITEMS[b.dataset.buy];if((g.coins||0)<it.price)return;g.coins-=it.price;bagAdd(b.dataset.buy,1);toast(`買了 ${it.emo} ${it.name}，放進背包了`);const st=S.scrollTop;shopSheet();$('#sheet').scrollTop=st});
  const t=S.querySelector('[data-ticket]');if(t)t.onclick=()=>{if((g.coins||0)<PACK_PRICE)return;g.coins-=PACK_PRICE;g.tickets++;save();updTix();toast('換到 1 張抽卡券 🎟️');shopSheet()};
}

function treatPicker(r,p){
  if(!needMe())return;const L=bagList('treat');
  if(treatsToday(p)>=TREAT_MAX)return toast(`${p.name} 今天已經吃了 ${TREAT_MAX} 個零食，不能再吃了～`);
  openModal(`<h3>🍤 給 ${esc(p.name)} 零食</h3><p class="lead">今天還能吃 ${TREAT_MAX-treatsToday(p)} 個・${esc(p.species)}最愛：${Object.values(ITEMS).filter(i=>i.fav&&i.fav.includes(p.species)).map(i=>i.emo+i.name).join('、')||'都愛'}</p>
    ${L.length?`<div class="shopgrid">${L.map(([id,n])=>`<button class="si pick" data-t="${id}">${itemIcon(id,'big')}<div class="sn">${ITEMS[id].name}</div><div class="sf">× ${n}</div></button>`).join('')}</div>`:'<div class="locked">背包裡沒有零食</div>'}
    <div class="row2" style="margin-top:12px"><button data-close>取消</button><button id="goshop">🏪 去商店買</button></div>`);
  $('#goshop').onclick=()=>shopSheet('treat');
  $('#sheet').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.t,it=ITEMS[id],fav=(it.fav||[]).includes(p.species)||(it.bday&&isBirthday(p.birthday));closeModal();
    bagAdd(id,-1);const d=todayTW();p.treatN=(p.treatDay===d?(+p.treatN||0):0)+1;p.treatDay=d;
    r.state='happy';r.until=performance.now()+2200;fx(it.emo,r.x,r.y-150*petScale(r.y));setTimeout(()=>fx(fav?'💖':'❤️',r.x+20,r.y-190*petScale(r.y)),350);if(fav)setTimeout(()=>{startAnim(r,'jump')},800);
    toast(fav?`是 ${p.name} 最愛的${it.name}！💖`:`${p.name} 吃了${it.name} 😋`);sfx('eat');setTimeout(()=>petSay(r,fav?'fav':'treat'),900);reward(fav?'treatFav':'treat');
    call('treat',{playerId:DB.me.id,petId:p.id,item:id,name:it.emo+it.name},true).catch(e=>toast(e.message));
    if(ONLINE)feedPush(`${DB.me.nick} 請 ${p.name} 吃了 ${it.emo}${it.name}`);
  });

async function openGift(gid){
  const h=house(home.id),g=(h.gifts||[]).find(x=>x.id===gid);if(!g)return;
  if(!isFamily(h.id))return toast(g.admin?'這是島主送給這個家的禮物，等家人來拆 👑':`這是 ${g.from} 送給這個家的禮物，等家人來拆 🎁`);
  if(g.admin){let r;try{r=await call('openGift',Object.assign(cred(),{giftId:gid}),true)}catch(e){return toast(e.message)}
    g.opened=(g.opened||[]).concat(DB.me.id);const a=(r&&r.admin)||g,G=DB.game,got=[];
    if(+a.coins){G.coins=(G.coins||0)+ +a.coins;got.push(`${a.coins} 金幣`)}if(+a.tickets){G.tickets=(G.tickets||0)+ +a.tickets;got.push(`${a.tickets} 張抽卡券`)}
    if(a.item&&ITEMS[a.item]&&+a.n){bagAdd(a.item,+a.n);got.push(`${ITEMS[a.item].name} ×${a.n}`)}save();updTix();
    fx('🎉',g.x,g.y-60);renderFloor();sfx('gift');sayAny('gift');
    openModal(`<div style="text-align:center"><div class="giftopen"><span class="ii huge"><img src="assets/gift_admin.webp" alt="" onerror="this.remove()"><b>🎁</b></span></div><h3>👑 島主送的禮物！</h3>${a.msg?`<p class="lead">「${esc(a.msg)}」</p>`:''}<p class="lead">${got.join('、')||'一份心意'}</p><p class="lead" style="font-size:12px">道具已經放進你的背包。每位家人都能各拆一份喔</p></div><div class="row2"><button data-close>謝謝島主 🎉</button></div>`);return}
  let r;try{r=await call('openGift',Object.assign(cred(),{giftId:gid}),true)}catch(e){return toast(e.message)}
  h.gifts=h.gifts.filter(x=>x.id!==gid);const it=ITEMS[g.item]||{name:'神秘禮物',emo:'🎁',kind:'treat'};
  if(it.kind==='toy'&&r&&r.toy)(h.toys=h.toys||[]).push(r.toy);else bagAdd(g.item,1);
  if(r&&r.note)DB.notes.push(r.note);
  fx('🎉',g.x,g.y-60);renderFloor();renderBoard();reward('open');sfx('gift');sayAny('gift');
  openModal(`<div style="text-align:center"><div class="giftopen">${itemIcon(g.item,'huge')}</div><h3>${esc(g.from)} 送你 ${esc(it.name)}！</h3>
    ${g.msg?`<p class="lead">「${esc(g.msg)}」</p>`:''}<p class="lead">${it.kind==='toy'&&r&&r.toy?'已經擺在家裡地上了，點一下可以移動或收起來':it.kind==='toy'?`地上已經有 ${TOY_MAX} 個玩具了，先放進你的背包`:'放進你的背包了'}</p></div>
    <div class="row2"><button data-close>好耶 🎉</button></div>`);
}

  const h=house(home.id);if(!isFamily(h.id)){const r=home.pets[Math.floor(Math.random()*home.pets.length)];if(r){r.tx=t.x+40;r.ty=t.y;r.state='walk';r.goal='toy'}return}
  openModal(`<h3>${itemIcon(t.item)} ${esc((ITEMS[t.item]||{}).name||'玩具')}</h3>
    <div class="row2"><button id="tmv">↔️ 移動位置</button><button id="tfl">🔁 翻面</button></div>
    <div class="row2"><button id="tbk">🎒 收回背包</button><button data-close>取消</button></div>`);
  $('#tmv').onclick=()=>{closeModal();placing={toy:t};toast('點地板上想放的位置')};
  $('#tfl').onclick=async()=>{t.flip=!t.flip;closeModal();renderFloor();call('moveToy',Object.assign(cred(),{toyId:t.id,x:t.x,y:t.y,flip:t.flip}),true).catch(e=>toast(e.message))};
  $('#tbk').onclick=async()=>{try{await call('removeToy',Object.assign(cred(),{toyId:t.id}))}catch(e){return toast(e.message)}h.toys=h.toys.filter(x=>x.id!==t.id);bagAdd(t.item,1);closeModal();renderFloor();toast('收回背包了')};

$('#home').addEventListener('click',async e=>{
  if(!placing||!home)return;if(e.target.closest('.pet,.poop,.toy,.gift,.tent,.petmenu,.famtools,.petheads,.visits,.board,button'))return;
  const rect=$('#home').getBoundingClientRect(),x=clamp((e.clientX-rect.left)/rect.width*RW,FLOOR.x0,FLOOR.x1),y=clamp((e.clientY-rect.top)/rect.height*RH,FLOOR.y0+20,FLOOR.y1);
  const h=house(home.id),P=placing;placing=null;
  if(P.toy){P.toy.x=Math.round(x);P.toy.y=Math.round(y);renderFloor();call('moveToy',Object.assign(cred(),{toyId:P.toy.id,x:P.toy.x,y:P.toy.y,flip:!!P.toy.flip}),true).catch(err=>toast(err.message));return}
  const tmp={id:'tmp'+uid(),item:P.item,x:Math.round(x),y:Math.round(y)};bagAdd(P.item,-1);(h.toys=h.toys||[]).push(tmp);renderFloor();toast('擺好了 🧸');
  call('placeToy',Object.assign(cred(),{item:P.item,x:tmp.x,y:tmp.y}),true).then(t=>{Object.assign(tmp,t)}).catch(err=>{h.toys=(h.toys||[]).filter(x=>x!==tmp);bagAdd(P.item,1);renderFloor();toast(err.message)});
});

const REW={login:{x:10,c:10,cap:1,n:'每天第一次打開（連續 7 天再送 1 張抽卡券）'},visit:{x:3,c:2,cap:5,n:'串門子（每家一天 1 次）'},pat:{x:2,c:1,cap:20,n:'摸摸頭'},
  feed:{x:5,c:3,cap:10,n:'餵飯'},poop:{x:10,c:5,n:'鏟屎'},treat:{x:10,c:0,n:'餵零食'},treatFav:{x:15,c:0,n:'餵到最愛的零食'},
  gift:{x:20,c:0,n:'送禮物'},open:{x:5,c:5,n:'拆禮物'},note:{x:10,c:5,cap:3,n:'在別人家留言'},rec:{x:5,c:3,cap:10,n:'記錄體重／紀錄項目'},
  walk:{x:10,c:5,cap:3,n:'遛遛（帶毛孩去別人家）'},wake:{x:2,c:1,cap:10,n:'叫醒／蓋被子'},guest:{x:2,c:1,cap:20,n:'你的毛孩在別人家被照顧'}};
const XP_LV=100;
function reward(k,mult){
  const e=REW[k];if(!e)return false;const g=DB.game,d=todayTW();
  if(!g.rd||g.rd.d!==d)g.rd={d};const n=g.rd[k]||0;if(e.cap&&n>=e.cap)return false;g.rd[k]=n+1;
  const dm=DB.dbl===todayTW()?2:1,x=e.x*(mult||1)*dm,c=e.c*(mult||1)*dm;g.xp=(g.xp||0)+x;g.coins=(g.coins||0)+c;g.lv=g.lv||1;let up=0;
  while(g.xp>=XP_LV){g.xp-=XP_LV;g.lv++;g.tickets++;up++}
  save();updTix();rewardPop(x,c);
  if(up)setTimeout(()=>{toast(`🎉 升到 Lv.${g.lv}！送你 ${up} 張抽卡券 🎟️`);sfx('levelup')},900);
  return true;
}
function earn(k){return reward(k)}
function progress(){}
function rewardPop(x,c){if(!x&&!c)return;if(c)sfx('coin');const el=document.createElement('div');el.className='coinpop';el.textContent=`${x?`+${x} 💗`:''}${c?` +${c} 🪙`:''}`;document.body.appendChild(el);setTimeout(()=>el.remove(),1500)}
function dailyLogin(){if(!DB.me)return;const g=DB.game,d=todayTW();if(g.loginDay===d)return;
  const y=twDay(Date.now()-86400e3);g.streak=g.loginDay===y?(+g.streak||0)+1:1;g.loginDay=d;
  if(reward('login'))setTimeout(()=>toast(`每日登入獎勵 +10 💗 +10 🪙・連續第 ${g.streak} 天`),600);
  if(g.streak%7===0){g.tickets=(g.tickets||0)+1;save();updTix();setTimeout(()=>{toast('🎉 連續登入 7 天！送你 1 張抽卡券 🎟️');sfx('levelup')},3200)}}
function visitReward(hid){if(!DB.me||isFamily(hid))return;const g=DB.game,d=todayTW();if(!g.vd||g.vd.d!==d)g.vd={d,l:[]};if(g.vd.l.includes(hid))return;g.vd.l.push(hid);reward('visit')}

function rollPack(h){
  const g=DB.game,own=owned(h.id),left=CARDS.filter(c=>!own.has(c.id));g.pity=(g.pity||0)+1;
  let type;

  else{const w={treat:50,toy:30,room:left.length?15:0,limited:5};let x=Math.random()*Object.values(w).reduce((a,b)=>a+b,0);for(const k in w){if((x-=w[k])<0){type=k;break}}}
  if(type==='room'){g.pity=0;const avail=Object.keys(RAR).filter(r=>left.some(c=>c.r===r));let x=Math.random()*avail.reduce((a,r)=>a+RAR[r].w,0),r=avail[0];for(const k of avail){if((x-=RAR[k].w)<0){r=k;break}}
    const pool=left.filter(c=>c.r===r);return {type,card:pool[Math.floor(Math.random()*pool.length)]}}
  const pick=f=>{const ids=Object.keys(ITEMS).filter(id=>f(ITEMS[id]));return ids[Math.floor(Math.random()*ids.length)]};
  if(type==='treat')return {type,items:[0,1,2].map(()=>pick(i=>i.kind==='treat'&&!i.bday))};
  if(type==='toy')return {type,items:[pick(i=>i.kind==='toy'&&!i.limited)]};

  return {type:'limited',items:[pick(i=>i.limited)]};
}

const SAY={"idle": ["今天也很可愛吧", "想出去玩～", "好無聊喔", "我要來搗蛋囉😜", "有人要陪我玩嗎？", "我是全世界最可愛的{名字}", "窗外有鳥！", "伸個懶腰～", "今天天氣不錯耶", "你在看我嗎？", "哼哼～"], "morning": ["早安！☀️", "還想再睡一下…", "早餐呢？", "新的一天開始囉～"], "night": ["愛睏😪", "有點睏了…", "今天好累喔", "差不多該睡了💤"], "hungry": ["好餓喔…", "飯呢？", "肚子在叫了", "有人要餵我嗎？🍖", "我可以吃東西嗎？", "碗是空的…"], "full": ["吃飽飽了～", "好好吃！", "肚子圓滾滾", "謝謝招待！"], "pat": ["再摸一下嘛！", "舒胡啦！", "最喜歡你了 💕", "呼嚕嚕～"], "treat": ["好好吃！", "還有嗎？", "謝謝你～", "零食最棒了"], "fav": ["這個我最愛！💖", "你怎麼知道！", "幸福～", "天啊太好吃了"], "visitor": ["你好呀！", "要一起玩嗎？", "歡迎來我家～", "你是誰呀？", "{主人}來了！"], "away": ["這裡好好玩！", "這是誰的家呀？", "我交到新朋友了", "有點想家…"], "poop": ["誰來掃一下…", "不是我拉的！", "好臭喔…", "快幫我清乾淨～"], "toy": ["拆家時間到！", "陪我玩嘛～", "看我的厲害！"], "gift": ["有禮物耶！🎁", "是給我的嗎？", "快拆快拆！"], "woke": ["嗯…？", "我醒了啦…", "好吧，陪你玩一下"], "bday": ["可以跟我說那四個字嗎🎂", "要記得送我禮物喔🎁", "我又長大一歲了！", "生日快樂我自己～"], "dbl": ["今天是幸運日！", "快來陪我玩賺金幣～"]};
function greets(p){return String(p.about||'').split('\n').map(x=>x.trim()).filter(Boolean).slice(0,3)}
function fillSay(t,p){return t.replace(/\{名字\}/g,p.name).replace(/\{主人\}/g,DB.me?DB.me.nick:'你')}
function situation(r,p){const h=house(home.id),hr=+new Date(Date.now()+8*3600e3).getUTCHours(),c=[];
  if(isBirthday(p.birthday))c.push('bday','bday');
  if(r.guest)c.push('away','away');
  else if(DB.me&&!isFamily(h.id))c.push('visitor','visitor');
  if(fullness(p)<30)c.push('hungry','hungry','hungry');
  if((h.poops||[]).length)c.push('poop');
  if((h.toys||[]).length)c.push('toy');
  if(DB.dbl===todayTW())c.push('dbl');
  if(hr>=6&&hr<10)c.push('morning');else if(hr>=20||hr<2)c.push('night');
  c.push('idle','idle');return c[Math.floor(Math.random()*c.length)]}
function petSay(r,kind,text){if(!r||!r.el||r.sleep)return;const p=pet(r.id);if(!p)return;
  let t=text;if(!t){const L=SAY[kind]||SAY.idle;t=L[Math.floor(Math.random()*L.length)]}if(!t)return;
  r.el.querySelectorAll('.say').forEach(x=>x.remove());const b=document.createElement('div');b.className='say';b.textContent=fillSay(t,p);r.el.appendChild(b);
  lastSayAt=Date.now();setTimeout(()=>{b.classList.add('out');setTimeout(()=>b.remove(),400)},4200)}
function sayAny(kind){if(!home)return;const L=home.pets.filter(r=>r.el&&!r.sleep);if(L.length)setTimeout(()=>petSay(L[Math.floor(Math.random()*L.length)],kind),900)}
let lastSayAt=0,nextSayGap=12000;
setInterval(()=>{if(!home||$('#home').classList.contains('hidden')||document.hidden||!$('#modal').classList.contains('hidden'))return;
  if(Date.now()-lastSayAt<nextSayGap)return;const L=home.pets.filter(r=>r.el&&!r.sleep&&r.el.style.display!=='none');if(!L.length)return;
  const r=L[Math.floor(Math.random()*L.length)],p=pet(r.id);if(!p)return;const own=greets(p);
  if(own.length&&Math.random()<0.5)petSay(r,null,own[Math.floor(Math.random()*own.length)]);else petSay(r,situation(r,p));
  nextSayGap=(25+Math.random()*30)*1000},2000);

// ================= 🌧️❄️ 小島天氣 =================
let wxNow=null;
function wxKind(){const d=new Date(Date.now()+8*3600e3),m=d.getUTCMonth()+1,day=d.getUTCDate();
  if(wxNow==='snow')return 'snow';if(m===12&&day>=15||m===1&&day<=1)return 'snow';return wxNow==='rain'?'rain':''}
function drawWx(){const el=$('#wx');if(!el)return;const k=wxKind();if(el.dataset.k===k)return;el.dataset.k=k;el.innerHTML='';el.className='wx '+k;if(!k)return;
  const n=k==='rain'?70:70;let h='';for(let i=0;i<n;i++){const x=Math.random()*100,dl=-Math.random()*(k==='rain'?1:12),du=k==='rain'?0.5+Math.random()*0.4:6+Math.random()*6,sz=k==='rain'?'':(()=>{const z=4+Math.random()*6;return `width:${z}px;height:${z}px;`})();
    h+=`<i style="left:${x}%;animation-delay:${dl}s;animation-duration:${du}s;${sz}--dx:${(Math.random()*40-20)}px"></i>`}el.innerHTML=h}
async function loadWx(){try{const c=JSON.parse(localStorage.getItem('mhd_wx')||'null');if(c&&Date.now()-c.t<30*60e3){wxNow=c.k;drawWx();return}}catch(e){}
  try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=25.04&longitude=121.56&current=precipitation,weather_code&timezone=Asia%2FTaipei');const j=await r.json();const wc=+(j.current&&j.current.weather_code),pr=+(j.current&&j.current.precipitation);
    wxNow=(wc>=71&&wc<=77||wc===85||wc===86)?'snow':((wc>=51&&wc<=67)||(wc>=80&&wc<=82)||wc>=95||pr>0.1)?'rain':'';try{localStorage.setItem('mhd_wx',JSON.stringify({t:Date.now(),k:wxNow}))}catch(e){}}catch(e){wxNow=null}
  drawWx()}
drawWx();loadWx();setInterval(loadWx,30*60e3);

// ================= 自動更新：發現新版本就重新載入 =================
const APP_VER='2026-11-11n';
function checkUpdate(){
  if(!/^https?:/.test(location.protocol)||!API_URL)return;
  if(!$('#modal').classList.contains('hidden'))return; // 正在填表單時不打斷
  fetch('./index.html?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(t=>{
    const m=t.match(/const APP_VER='([^']+)'/);if(!m||m[1]===APP_VER)return;
    try{if(sessionStorage.getItem('mhd_upd')===m[1])return;sessionStorage.setItem('mhd_upd',m[1])}catch(e){}
    location.replace(location.pathname+'?v='+encodeURIComponent(m[1]));
  }).catch(()=>{})}
setTimeout(checkUpdate,2000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate()});
</script>
