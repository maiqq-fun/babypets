<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>毛很多</title>
<meta name="description" content="毛很多：朋友們的毛孩小島">
<meta name="theme-color" content="#2b2b38">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="毛很多">
<link rel="manifest" href="manifest.json">
<meta property="og:title" content="毛很多">
<meta property="og:description" content="來島上看看大家的毛孩 🐾">
<meta property="og:image" content="https://maiqq-fun.github.io/babypets/assets/share_preview.jpg">
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root{--ink:#5a4030;--soft:#9a8270;--cream:#fffaee;--line:#efe1cc;--wood:#b98d62;--accent:#ff9a6b;--accent-d:#e07a4c;--night:#2b2b38;--danger:#d9534f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--night);font-family:"Huninn","PingFang TC","Noto Sans TC",sans-serif;color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stage{position:relative;width:100%;max-width:520px;margin:0 auto;overflow:hidden;user-select:none;-webkit-user-select:none}
.island{aspect-ratio:2/3;background:#a9def0}
.home{aspect-ratio:2/3;background:#f3dcc0;container-type:inline-size}
.hidden{display:none!important}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.island .bg{opacity:0;transition:opacity 1.2s ease}
.island .bg.on{opacity:1}
.thing{position:absolute;transform:translate(-50%,-100%);cursor:pointer;transition:transform .15s}
.thing img{display:block;width:100%;height:auto;pointer-events:none}
.thing:active{transform:translate(-50%,-100%) scale(.94)}
.thing.pick{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{filter:drop-shadow(0 0 0 #fff)}50%{filter:drop-shadow(0 0 10px #fff) brightness(1.15)}}
.label{position:absolute;transform:translate(-50%,0);white-space:nowrap;pointer-events:none;
  font-size:clamp(10px,2.7vw,13px);padding:2px 9px;border-radius:999px;background:rgba(255,250,238,.93);
  border:1.5px solid var(--wood);color:#6b4b33;box-shadow:0 1px 0 rgba(0,0,0,.12)}
.label.mine{background:#fff0e6;border-color:var(--accent);color:#b4532a}
.label.lot{background:rgba(255,255,255,.85);border-style:dashed;color:#7a5a40;padding:0;width:1.9em;height:1.9em;display:flex;align-items:center;justify-content:center;font-size:clamp(13px,3.6vw,17px)}
.bubble{position:absolute;transform:translate(-50%,-100%);font-size:clamp(14px,4.4vw,22px);background:#fff;border-radius:50%;
  width:2em;height:2em;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 rgba(0,0,0,.15);
  animation:bob 1.8s ease-in-out infinite;pointer-events:none}
.bubble::after{content:"";position:absolute;bottom:-5px;left:50%;margin-left:-5px;border:5px solid transparent;border-top-color:#fff;border-bottom:0}
@keyframes bob{0%,100%{margin-top:0}50%{margin-top:-5px}}
.top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;pointer-events:none;z-index:3000}
.top>*{pointer-events:auto}
.title{font-size:clamp(26px,8vw,38px);color:#fff;letter-spacing:3px;pointer-events:none!important;
  text-shadow:-2px -2px 0 #8a5a3a,2px -2px 0 #8a5a3a,-2px 2px 0 #8a5a3a,2px 2px 0 #8a5a3a,0 4px 0 #8a5a3a}
.topright{display:flex;gap:10px;align-items:center}
.logo{width:40%;max-width:210px;height:auto;pointer-events:none!important;filter:drop-shadow(0 3px 2px rgba(60,35,15,.35))}
.circle{position:relative;width:46px;height:46px;border-radius:50%;background:#fff6e6;border:3px solid #fff;box-shadow:0 0 0 2px var(--wood);
  display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden;padding:0}
.circle img{width:100%;height:100%;object-fit:cover;border-radius:50%}
#tix{overflow:visible}
.badge{position:absolute;right:-6px;top:-6px;min-width:20px;height:20px;border-radius:10px;background:#ff5e5e;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;padding:0 4px;z-index:2}
.ticker{position:absolute;left:14px;right:14px;bottom:9.5%;z-index:3000;background:rgba(255,250,238,.92);border:1.5px solid var(--wood);border-radius:999px;
  padding:4px 12px;font-size:clamp(11px,3.1vw,13px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.12);transition:opacity .3s}
.pickbar{position:absolute;left:50%;bottom:9.5%;transform:translateX(-50%);z-index:3001;background:var(--accent);color:#fff;border-radius:14px;padding:8px 14px;font-size:14px;display:flex;gap:10px;align-items:center;white-space:nowrap;box-shadow:0 3px 0 var(--accent-d)}
.pickbar button{border:0;background:rgba(255,255,255,.25);color:#fff;border-radius:10px;padding:3px 10px}
.bar{position:absolute;left:50%;bottom:2.2%;transform:translateX(-50%);display:flex;gap:4px;background:rgba(255,250,238,.92);
  padding:4px;border-radius:999px;box-shadow:0 2px 0 rgba(0,0,0,.15);z-index:3000}
.bar button{border:0;background:transparent;color:#7a5a40;font-size:13px;padding:6px 10px;border-radius:999px;white-space:nowrap}
.bar button.on{background:var(--accent);color:#fff}
/* home */
.pill{border:2px solid var(--wood);background:rgba(255,250,238,.94);border-radius:999px;padding:6px 14px;font-size:15px;box-shadow:0 2px 0 rgba(0,0,0,.12);white-space:nowrap}
.housename{font-size:clamp(15px,4.4vw,19px);padding:6px 14px;max-width:48%;overflow:hidden;text-overflow:ellipsis;text-align:center}
.pet{position:absolute;transform-origin:50% 100%;cursor:pointer}
.pet .body{display:block;transform-origin:50% 100%}
.pet img{display:block;width:100%;height:auto;pointer-events:none}
.pet .emoji{display:block;text-align:center;line-height:1;pointer-events:none}
.pet .shadow{position:absolute;left:12%;right:12%;bottom:-4%;height:12%;border-radius:50%;background:rgba(90,55,25,.22);filter:blur(3px);z-index:-1}
.pet .nm{position:absolute;left:50%;bottom:-1.6em;transform:translateX(-50%);font-size:clamp(10px,2.6cqw,13px);background:rgba(255,250,238,.85);border-radius:999px;padding:0 7px;white-space:nowrap;pointer-events:none}
.poop{position:absolute;transform:translate(-50%,-100%);font-size:clamp(22px,7vw,34px);cursor:pointer;line-height:1;padding:6px;border:0;background:transparent;filter:drop-shadow(0 3px 2px rgba(90,55,25,.3))}
.bowl{position:absolute;transform:translate(-50%,-100%);font-size:clamp(26px,8vw,40px);line-height:1;filter:drop-shadow(0 3px 2px rgba(90,55,25,.3))}
.fx{position:absolute;pointer-events:none;font-size:clamp(16px,5vw,24px);animation:float 1.3s ease-out forwards;z-index:2500}
@keyframes float{0%{opacity:0;transform:translate(-50%,0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-70px) scale(1.15)}}
.board{position:absolute;display:grid;grid-template-columns:repeat(3,1fr);gap:4%;padding:3%}
.note{aspect-ratio:1;border:0;padding:6%;font-size:clamp(8px,2.2vw,11px);line-height:1.25;text-align:left;overflow:hidden;
  box-shadow:0 2px 3px rgba(0,0,0,.18);color:#5a4030;display:flex;flex-direction:column;justify-content:space-between}
.note small{font-size:.85em;opacity:.7;text-align:right}
.note.empty{background:transparent!important;box-shadow:none;border:1.5px dashed rgba(122,90,64,.45);color:#8a6a50;align-items:center;justify-content:center;font-size:clamp(12px,3.4vw,16px)}
.empty-home{position:absolute;left:50%;top:72%;transform:translate(-50%,-50%);background:rgba(255,250,238,.95);border:2px dashed var(--wood);border-radius:18px;padding:14px 18px;text-align:center;font-size:15px;line-height:1.6;width:70%}
.empty-home button{margin-top:8px;border:0;background:var(--accent);color:#fff;border-radius:12px;padding:8px 14px}
.actions{position:absolute;left:50%;bottom:2.4%;transform:translateX(-50%);display:flex;gap:8px;z-index:3000}
.act{border:2px solid var(--wood);background:rgba(255,250,238,.95);border-radius:18px;padding:8px 13px;font-size:15px;box-shadow:0 3px 0 rgba(0,0,0,.15);white-space:nowrap}
.act:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
.famtools{position:absolute;right:12px;top:62px;display:flex;flex-direction:column;gap:8px;z-index:3000}
.famtools .act{font-size:13px;padding:6px 10px}
.petmenu{position:absolute;transform:translate(-50%,-100%);display:flex;gap:6px;background:#fff;padding:6px;border-radius:16px;box-shadow:0 3px 0 rgba(0,0,0,.15);z-index:2800}
.petmenu button{border:0;background:#fff3e2;border-radius:12px;padding:7px 10px;font-size:14px;white-space:nowrap}
/* modal */
.modal{position:fixed;inset:0;background:rgba(40,25,15,.45);display:flex;align-items:flex-end;justify-content:center;z-index:5000}
.sheet{background:var(--sheetbg,var(--cream));width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px 24px}
@media(min-width:600px){.modal{align-items:center}.sheet{border-radius:24px}}
.sheet h3{margin:0 0 4px;font-weight:normal;font-size:20px;text-align:center;text-wrap:balance}
.sheet .lead{text-align:center;color:var(--soft);font-size:14px;margin:0 0 14px;line-height:1.6}
.field{margin-bottom:12px}
.field label,.flabel{display:block;font-size:13px;color:var(--soft);margin:0 0 5px 4px}
.field input,.field select,.field textarea{width:100%;font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
.field textarea{min-height:70px;resize:vertical}
.field input{min-width:0;max-width:100%}
.field input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-height:46px;line-height:22px;text-align:left}
.field input[type=date]::-webkit-date-and-time-value{text-align:left}
.two{display:flex;gap:10px}.two>.field{flex:1;min-width:0}
.hint{font-size:12px;color:#a08670;margin:4px 4px 0;line-height:1.5}
.choices{display:flex;flex-wrap:wrap;gap:6px}
.choices button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:7px 11px;font-size:15px}
.choices button.on{border-color:var(--accent);background:#fff0e8}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:38px;height:38px;border-radius:50%;border:0;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.swatches button.on{outline:3px solid var(--ink);outline-offset:2px}
.big3{display:grid;gap:10px;margin-top:6px}
.big3 button{display:flex;gap:12px;align-items:center;text-align:left;border:2px solid var(--line);background:#fff;border-radius:16px;padding:12px 14px;font-size:16px}
.big3 button .e{font-size:30px}
.big3 button small{display:block;color:var(--soft);font-size:12px;margin-top:2px}
.styles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.styles button{min-width:0;overflow:hidden;position:relative;border:2px solid var(--line);background:#fff;border-radius:12px;padding:4px;aspect-ratio:1}
.styles button img{display:block;width:100%;height:100%;min-width:0;object-fit:contain}
.styles button.on{border-color:var(--accent);background:#fff0e8;box-shadow:0 0 0 2px var(--accent)}
.styles button:disabled{opacity:.45;cursor:not-allowed}
.styles button:disabled::after{content:"已有人住";position:absolute;left:50%;bottom:3px;transform:translateX(-50%);font-size:10px;background:#7a6050;color:#fff;border-radius:8px;padding:1px 6px;white-space:nowrap}
.rooms{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rooms button{min-width:0;border:2px solid var(--line);background:#fff;border-radius:12px;padding:4px;display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--soft)}
.rooms button img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px}
.rooms button.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent);color:var(--ink)}
.steps{display:flex;justify-content:center;gap:6px;margin:6px 0 12px}
.steps i{width:22px;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--accent)}
.row2{display:flex;gap:10px;margin-top:10px}
.row2.sticky{position:sticky;bottom:-24px;margin:10px -16px -24px;padding:10px 16px 18px;background:var(--sheetbg,var(--cream));box-shadow:0 -6px 10px -8px rgba(90,60,30,.25);z-index:2}
.row2 button{flex:1;padding:12px;border-radius:14px;font-size:16px;border:2px solid var(--line);background:#fff}
.row2 .primary{background:var(--accent);border-color:var(--accent);color:#fff}
.row2 .primary:disabled{background:#d9cbbb;border-color:#d9cbbb}
.err{color:var(--danger);font-size:13px;min-height:18px;text-align:center;margin-top:4px}
.count{font-size:12px;color:var(--soft);text-align:right;margin-top:4px}
.photo{display:flex;gap:12px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px}
.photo .pv{width:72px;height:72px;flex:none;border-radius:12px;background:#f6ecdd;display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden}
.photo .pv.round{border-radius:50%}
.photo .pv img{width:100%;height:100%;object-fit:contain}
.photo .pv.round img{object-fit:cover;object-position:50% 15%}
.photo .pv.check{background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0 0/14px 14px}
.photo .info{flex:1;font-size:13px;color:var(--soft);line-height:1.5}
.photo .btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.photo .btns label,.photo .btns button{border:2px solid var(--line);background:#fffaf2;border-radius:10px;padding:5px 9px;font-size:13px;color:var(--ink);cursor:pointer}
.prompt{background:#fff;border:2px dashed var(--line);border-radius:12px;padding:10px;font-size:12px;line-height:1.6;white-space:pre-wrap;color:#6b5545;max-height:180px;overflow:auto;user-select:text;-webkit-user-select:text}
details{margin-top:6px}
details summary{font-size:13px;color:var(--accent-d);cursor:pointer}
.visits{position:absolute;left:50%;top:58px;transform:translateX(-50%);z-index:2900;background:rgba(255,250,238,.9);border-radius:999px;padding:3px 12px;font-size:12px;white-space:nowrap;max-width:70%;overflow:hidden;text-overflow:ellipsis;box-shadow:0 1px 0 rgba(0,0,0,.1)}
.nightdim{position:absolute;inset:0;background:rgba(20,25,60,.38);opacity:0;transition:opacity 1s;pointer-events:none}
.nightdim.on{opacity:1}
.poop{width:clamp(30px,9cqw,46px)}.poop img{width:100%;display:block;pointer-events:none}
.bowl{width:clamp(56px,15cqw,80px)}.bowl img{width:100%;display:block}
.tent{position:absolute;cursor:pointer}
.tent>img{display:block;width:100%;transform-origin:50% 100%;animation:breathe 3.2s ease-in-out infinite;filter:drop-shadow(0 4px 3px rgba(90,55,25,.25))}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,1.045)}}
.tent .zz{position:absolute;left:58%;top:30%;pointer-events:none}
.tent .zz i{position:absolute;font-style:normal;color:#7a68c8;font-size:clamp(12px,3.4cqw,18px);opacity:0;animation:zz 3s linear infinite;text-shadow:0 1px 0 #fff}
.tent .zz i:nth-child(2){animation-delay:1s}.tent .zz i:nth-child(3){animation-delay:2s}
@keyframes zz{0%{opacity:0;transform:translate(0,0) scale(.7)}20%{opacity:1}100%{opacity:0;transform:translate(22px,-40px) scale(1.3)}}
.tent .flag{position:absolute;left:-4%;top:28%;width:28%;aspect-ratio:1;border-radius:50%;overflow:hidden;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tent .flag img{width:100%;height:100%;object-fit:cover}
.tent .nm{position:absolute;left:50%;bottom:-1.7em;transform:translateX(-50%);font-size:clamp(10px,2.6cqw,13px);background:rgba(255,250,238,.9);border-radius:999px;padding:0 8px;white-space:nowrap}
.petmenu{flex-direction:column;align-items:stretch;min-width:150px}
.pm-h{display:flex;align-items:center;gap:6px;font-size:14px;padding:0 2px}
.pm-h .tr{font-size:11px;background:#fff0e0;color:#b4532a;border-radius:8px;padding:1px 6px}
.pm-s{display:flex;align-items:center;gap:6px;font-size:12px;padding:0 2px}
.sbar{flex:1;height:7px;border-radius:4px;background:#f1e6d8;overflow:hidden}.sbar i{display:block;height:100%;border-radius:4px}
.pm-b{display:flex;gap:6px}
.nb{display:block;width:100%;text-align:left;border:0;border-radius:6px;padding:12px;margin-bottom:8px;font-size:15px;line-height:1.5;box-shadow:0 2px 3px rgba(0,0,0,.12);color:#5a4030}
.nb small{display:block;font-size:12px;opacity:.7;margin-top:4px}
.m small.st{color:var(--accent-d)}
.mini em{position:absolute;left:3px;bottom:3px;font-style:normal;font-size:10px;background:rgba(255,255,255,.9);border-radius:6px;padding:0 4px;color:#7a6050}
.gbtns{flex-wrap:wrap;justify-content:center}
@media (prefers-reduced-motion:reduce){.tent>img,.tent .zz i{animation:none}}
/* 身分證主題色：整個畫面跟著換 */
.sheet.themed{--sheetbg:color-mix(in srgb,var(--cc) 9%,#fffaf5)}
.sheet.themed .sec,.sheet.themed .idcard{border-color:color-mix(in srgb,var(--cc) 35%,#fff)}
.sheet.themed .idcard{box-shadow:0 3px 0 color-mix(in srgb,var(--cc) 40%,#fff)}
.sheet.themed .sec h4{color:color-mix(in srgb,var(--cc) 70%,#3a2a20)}
.sheet.themed .sec h4 button{background:color-mix(in srgb,var(--cc) 16%,#fff);color:color-mix(in srgb,var(--cc) 80%,#2a1a10)}
.sheet.themed .rec{border-top-color:color-mix(in srgb,var(--cc) 25%,#fff)}
.sheet.themed .row2 button{border-color:color-mix(in srgb,var(--cc) 30%,#fff)}
.sheet.themed .row2 .primary,.sheet.themed .choices button.on{background:var(--cc);border-color:var(--cc);color:#fff}
.sheet.themed .field input:focus,.sheet.themed .field select:focus,.sheet.themed .field textarea:focus{border-color:var(--cc)}
.sheet.themed .idphoto{border-color:color-mix(in srgb,var(--cc) 35%,#fff);background:color-mix(in srgb,var(--cc) 12%,#fff)}
.sheet.themed .idfields dt{color:color-mix(in srgb,var(--cc) 60%,#6a5a50)}
/* id card */
.idcard{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 3px 0 #e8d6bd;border:2px solid var(--line)}
.idhead{background:var(--cc);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:8px 14px;font-size:15px;letter-spacing:1px}
.idhead span{font-size:12px;opacity:.9;font-variant-numeric:tabular-nums}
.idbody{display:flex;gap:14px;padding:14px}
.idphoto{width:36%;flex:none;aspect-ratio:1;align-self:flex-start;border-radius:10px;overflow:hidden;background:#fff1dc;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:48px}
.idphoto img{width:100%;height:100%;object-fit:cover}
.idfields{flex:1;display:grid;grid-template-columns:auto 1fr;gap:5px 10px;font-size:14px;align-content:start;margin:0}
.idfields dt{color:#a08670;font-size:12px;padding-top:2px}
.idfields dd{margin:0}
.idname{grid-column:1/-1;font-size:22px;margin-bottom:2px}
.stamp{position:absolute;right:16px;bottom:12px;width:58px;height:58px;border:2.5px solid var(--cc);opacity:.6;border-radius:50%;color:var(--cc);
  display:flex;align-items:center;justify-content:center;font-size:11px;transform:rotate(-14deg);text-align:center;line-height:1.2}
.idbottom{position:relative;padding:0 80px 14px 14px;font-size:14px;color:#7a6050;min-height:64px}
.idstat{display:flex;align-items:center;gap:6px;font-size:12px;margin-top:6px;max-width:220px}
.trt{font-size:12px;background:color-mix(in srgb,var(--cc) 18%,#fff);color:color-mix(in srgb,var(--cc) 75%,#2a1a10);border-radius:8px;padding:1px 7px}
.sec{margin-top:14px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 12px}
.sec h4{margin:0 0 6px;font-weight:normal;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.sec h4 span{font-size:12px;color:#a08670}
.sec h4 button{border:0;background:#fff0e8;color:var(--accent-d);border-radius:10px;padding:4px 10px;font-size:13px}
.locked{color:#a08670;font-size:13px;text-align:center;padding:6px 0}
.rec{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px dashed var(--line);font-size:14px}

<script>
// ================= 常數 =================
const SLOTS=[[560,370],[770,420],[430,470],[270,580],[160,680],[560,650],[770,710],[620,850],[850,860],[470,990],[270,970],[700,1070]];
const STYLE_NAMES={1:'粉紅陽台屋',2:'紅屋頂木屋',3:'蘑菇屋',4:'藤蔓石屋',5:'藍屋頂小屋',6:'麵包坊',7:'魔法師小屋',8:'燈塔屋',9:'南瓜屋',10:'海邊小屋',11:'人魚貝殼屋',12:'綠頂莊園'};
const SPECIES=[['狗','🐕'],['貓','🐈'],['兔','🐇'],['倉鼠','🐹'],['鳥','🐦'],['其他','🐾']];
const spEmoji=s=>(SPECIES.find(x=>x[0]===s)||SPECIES[5])[1];
const SPK={狗:'dog',貓:'cat',兔:'rabbit',倉鼠:'hamster',鳥:'bird',其他:'other'};
const defHead=s=>`assets/pet_head_${SPK[s]||'other'}.webp`,defBody=s=>`assets/pet_body_${SPK[s]||'other'}.webp`;
const petHead=p=>p.head||defHead(p.species),petBody=p=>p.body||defBody(p.species);
const ROOMS=[['basic1','木質暖陽'],['basic2','復古木屋'],['basic3','森林小屋']];
const roomImg=id=>ROOMS.some(r=>r[0]===id)?`assets/room_${id}.webp`:/^(study|garden|cafe|beach|sakura|forest|cloud|xmas|ocean|star|space)$/.test(id||'')?`assets/room_card_${id}.webp`:'assets/room_basic1.webp';
const CARD_COLORS=[['蜜桃橘','#ff9a6b'],['櫻花粉','#f48fb1'],['天空藍','#64b5f6'],['薄荷綠','#5fbf95'],['薰衣草','#9b8cff'],['奶茶棕','#b98d62']];
const NOTE_COLORS=['#ffe98a','#ffc7d4','#bfe3ff','#c9f0c0','#ffd6a8'];
const MED_TYPES=['看診','疫苗','驅蟲','健檢','手術','用藥','其他'];
const EXP_CATS=['飼料','零食','用品','醫療','美容','保險','其他'];
const HOUR=3600e3;

// ================= 本機資料（試做版存在這支手機的瀏覽器） =================
const KEY='maohenduo_proto_v4';
// ★ 接上 Google 試算表：把 Apps Script 部署網址（/exec 結尾）貼在這裡；留空＝試做模式（只存在這支手機）
const API_URL='https://script.google.com/macros/s/AKfycbxPZVAM4VzgWgCmjhHfgi-o7JcJTyhkMUCIIxhF3OgDBQOTy-8C-XyUAZS0HEcy0Koq/exec';
const ONLINE=!!API_URL;
const OKEY='maohenduo_online_v1';
let DB;
function uid(){return Math.random().toString(36).slice(2,9)}
function sha256(str){
  const s=unescape(encodeURIComponent(str)),K=[],H=[];let p=2,n=0;
  const isP=x=>{for(let f=2;f*f<=x;f++)if(x%f===0)return false;return true},fr=x=>((x-Math.floor(x))*4294967296)|0;
  while(n<64){if(isP(p)){if(n<8)H[n]=fr(Math.pow(p,1/2));K[n]=fr(Math.pow(p,1/3));n++}p++}
  const w=[],bl=s.length*8,words=[];for(let i=0;i<s.length;i++)words[i>>2]|=s.charCodeAt(i)<<((3-i%4)*8);
  words[bl>>5]|=0x80<<(24-bl%32);words[((bl+64>>9)<<4)+15]=bl;
  const rr=(v,a)=>(v>>>a)|(v<<(32-a));let h=H.slice();
  for(let j=0;j<words.length;j+=16){const o=h.slice();
    for(let i=0;i<64;i++){if(i<16)w[i]=words[j+i]|0;else{const a=w[i-15],b=w[i-2];w[i]=(w[i-16]+(rr(a,7)^rr(a,18)^(a>>>3))+w[i-7]+(rr(b,17)^rr(b,19)^(b>>>10)))|0}
      const t1=(h[7]+(rr(h[4],6)^rr(h[4],11)^rr(h[4],25))+((h[4]&h[5])^(~h[4]&h[6]))+K[i]+w[i])|0,t2=((rr(h[0],2)^rr(h[0],13)^rr(h[0],22))+((h[0]&h[1])^(h[0]&h[2])^(h[1]&h[2])))|0;
      h=[(t1+t2)|0].concat(h);h[4]=(h[4]+t1)|0;h.length=8}
    for(let i=0;i<8;i++)h[i]=(h[i]+o[i])|0}
  return h.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}
function hashPw(pw){return sha256('mhd:'+pw)}
function todayTW(){try{return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei'}).format(new Date())}catch(e){return new Date().toISOString().slice(0,10)}}
function seed(){
  const now=Date.now();const H=(slot,style,name,motto,pets)=>({id:uid(),slot,style,name,motto,pw:hashPw('1234'),room:'basic1',owned:[],createdAt:now-86400e3*5,poops:[{id:uid(),x:220,y:1080},{id:uid(),x:640,y:990}],poopAt:now,_pets:pets});
  const houses=[
    H(1,2,'阿橘小屋','每天都在掉橘毛',[{name:'阿橘',species:'貓',breed:'橘貓',sex:'♂',birthday:'2020-04-01',color:'橘白',about:'飯量是別人的兩倍',trait:'貪吃'}]),
    H(2,3,'豆花蘑菇屋','',[{name:'豆花',species:'貓',breed:'玳瑁',sex:'♀',birthday:'2021-'+todayTW().slice(5),color:'黑橘玳瑁',about:'膽小但很愛吃，聽到罐頭聲會衝出來',card:'#f48fb1',trait:'黏人'}]),
    H(3,4,'毛球莊','兩隻狗一隻貓',[{name:'毛球',species:'狗',breed:'博美',sex:'♂',birthday:'2019-12-24',color:'奶油',about:'看到鏡子會吵架',trait:'活潑'},{name:'黑糖',species:'貓',breed:'米克斯',sex:'♀',birthday:'2022-06-10',color:'黑',about:'夜行性',trait:'高冷'}]),
    H(4,5,'小白窩','',[{name:'小白',species:'狗',breed:'柴犬',sex:'♀',birthday:'2021-09-09',color:'白柴',about:'不給摸屁股',trait:'高冷'}]),
    H(5,6,'胖虎麵包坊','',[{name:'胖虎',species:'狗',breed:'法鬥',sex:'♂',birthday:'2022-01-15',color:'虎斑',about:'打呼很大聲',trait:'愛睡'}]),
    H(6,9,'南瓜家','',[{name:'南瓜',species:'兔',breed:'垂耳兔',sex:'♀',birthday:'2023-10-31',color:'橘',about:'會自己開籠子',trait:'活潑'}]),
    H(8,10,'海風小屋','',[{name:'浪浪',species:'狗',breed:'米克斯',sex:'♂',birthday:'2024-03-03',color:'黑白',about:'剛被收編，還在適應',trait:'黏人'}]),
    H(9,12,'可可莊園','',[{name:'可可',species:'倉鼠',breed:'黃金鼠',sex:'♀',birthday:'2025-05-05',color:'奶茶',about:'臉頰永遠塞滿',trait:'貪吃'}]),
  ];
  const pets=[],weights=[];let no=1;
  houses.forEach(h=>{h._pets.forEach(p=>{const id=uid();pets.push({id,houseId:h.id,no:no++,breed:'',fixed:'',chip:'',allergy:'',card:CARD_COLORS[(no)%6][1],createdAt:now-86400e3*4,...p});
    const base={狗:6,貓:4.2,兔:1.8,倉鼠:0.12}[p.species]||3;
    [['2026-05-01',0.92],['2026-07-01',0.96],['2026-09-01',0.99],['2026-11-01',1]].forEach(([d,k])=>weights.push({id:uid(),petId:id,date:d,kg:+(base*k).toFixed(2),createdAt:now}))});delete h._pets});
  return {v:2,me:null,houses,pets,weights,medical:[],expenses:[],notes:[
    {id:uid(),houseId:houses[1].id,by:'阿橘',text:'豆花今天好可愛！下次帶罐罐來',color:'#ffe98a',createdAt:now-HOUR*3},
    {id:uid(),houseId:houses[1].id,by:'小白',text:'週末一起去狗公園嗎？',color:'#bfe3ff',createdAt:now-HOUR*2}],
    feed:[{t:'阿橘 幫 豆花 清了大便 🧹',at:now-HOUR*0.2},{t:'小白 在 豆花蘑菇屋 貼了便利貼 📝',at:now-HOUR*2},{t:'胖虎 量了體重 ⚖️',at:now-HOUR*5},{t:'海風小屋 搬來了新成員「浪浪」🐾',at:now-86400e3}],
    game:{tickets:1,prog:{poop:8,note:3,feed:4,weight:2},noteDay:['',0],feedAt:{},weightDay:''},owned:{},nextNo:no};
}
function emptyGame(){return {tickets:1,prog:{poop:0,note:0,feed:0,weight:0},noteDay:['',0],feedAt:{},weightDay:''}}
function load(){
  if(ONLINE){let o={};try{o=JSON.parse(localStorage.getItem(OKEY)||'{}')}catch(e){}
    return {me:o.me||null,game:o.game||emptyGame(),houses:[],pets:[],weights:[],medical:[],expenses:[],notes:[],feed:[],owned:{},famOk:false}}
  try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){}return seed()}
let pushT;
function save(){
  try{if(ONLINE)localStorage.setItem(OKEY,JSON.stringify({me:DB.me,game:DB.game}));else localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){toast('手機空間不夠，這次的變更可能沒存到')}
  if(ONLINE&&DB.me){clearTimeout(pushT);pushT=setTimeout(()=>api('savePlayer',{player:{id:DB.me.id,nick:DB.me.nick,game:DB.game}}).catch(()=>{}),1500)}
}
// ---------- 連線 ----------
async function api(action,payload){
  const res=await fetch(API_URL,{method:'POST',body:JSON.stringify(Object.assign({action},payload||{}))});
  const j=await res.json();if(!j.ok)throw new Error(j.error||'連線失敗');return j.data;
}
function lockSheet(on){const sh=$('#sheet');if(!sh)return;sh.querySelectorAll('button').forEach(b=>{if(on){b.dataset.wd=b.disabled?'1':'';b.disabled=true}else if(b.dataset.wd!==undefined){b.disabled=b.dataset.wd==='1';delete b.dataset.wd}});
  const pr=sh.querySelector('.row2 .primary');if(pr){if(on){if(!pr.dataset.txt){pr.dataset.txt=pr.textContent;pr.textContent='送出中…'}}else if(pr.dataset.txt){pr.textContent=pr.dataset.txt;delete pr.dataset.txt}}}
let busyN=0;function busy(on){busyN+=on?1:-1;$('#busy').classList.toggle('hidden',busyN<=0)}
const cred=()=>({playerId:DB.me&&DB.me.id,houseId:DB.me&&DB.me.houseId,pw:DB.me&&DB.me.pw});
async function call(action,payload,quiet){
  if(!ONLINE){const r=LOCAL[action](payload||{});save();return r}
  if(!quiet){busy(true);lockSheet(true)}
  try{return await api(action,payload)}catch(e){if(/Failed to fetch|NetworkError|Load failed/.test(e.message))throw new Error('連不上小島，請檢查網路再試一次');throw e}
  finally{if(!quiet){busy(false);lockSheet(false)}}
}
let syncing=false;
async function sync(quiet){
  if(!ONLINE||syncing)return;syncing=true;
  try{const d=await api('getState',cred());
    Object.assign(DB,{houses:d.houses,pets:d.pets,weights:d.weights,medical:d.medical,expenses:d.expenses,notes:d.notes,feed:d.feed,famOk:d.famOk});
    DB.houses.forEach(h=>{if(!Array.isArray(h.poops))h.poops=[]});
    DB.owned={};d.houses.forEach(h=>DB.owned[h.id]=Array.isArray(h.owned)?h.owned:[]);
    if(d.player&&DB.me){DB.me.houseId=d.player.houseId||null;if(!DB.gameSynced&&d.player.game&&d.player.game.prog&&!localStorage.getItem(OKEY+'_g')){DB.game=d.player.game}}
    DB.gameSynced=true;try{localStorage.setItem(OKEY+'_g','1')}catch(e){}

const TRAITS=['貪吃','愛睡','活潑','高冷','黏人'];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function hash01(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return ((h>>>0)%100000)/100000}
const TWO=8*HOUR;const twMin=t=>{const d=new Date(t+TWO);return d.getUTCHours()*60+d.getUTCMinutes()};
const twDay=t=>new Date(t+TWO).toISOString().slice(0,10);
function dayStart(t){const d=new Date(t+TWO);return t-(d.getUTCHours()*60+d.getUTCMinutes())*60000-d.getUTCSeconds()*1000-d.getUTCMilliseconds()}
function fullness(p,now){if(!p.lastFed)return 55;return clamp(Math.round(100-((now||Date.now())-p.lastFed)/HOUR*12.5),0,100)}
function mealsToday(p){return p.mealDay===todayTW()?(+p.meals||0):0}
function mood(p,h){const now=Date.now(),pats=(Array.isArray(p.pats)?p.pats:[]).filter(t=>now-t<3*HOUR).length;
  const vis=h.visits&&h.visits.day===todayTW()?(h.visits.list||[]).length:0;
  return clamp(35+15*Math.min(3,pats)+10*Math.min(2,vis)+(fullness(p)>=50?10:-10)-10*Math.min(3,(h.poops||[]).length),0,100)}
// 睡覺：所有人看到的一樣（用毛孩 id ＋ 日期 ＋ 時段決定）
function sleepState(p,now){

const ACTS={

  stretch:{dur:1400,f:(t)=>{const k=Math.sin(t*Math.PI);return {sx:1+0.28*k,sq:1-0.18*k}}},
  roll:{dur:1500,f:(t)=>({rot:t<0.5?t*2*180:180+(t-0.5)*2*180,dy:-Math.sin(t*Math.PI)*12})},
  wiggle:{dur:1600,f:(t)=>({rot:Math.sin(t*Math.PI*6)*8})},
  dodge:{dur:600,f:(t)=>({dx:Math.sin(t*Math.PI)*60,dy:-Math.sin(t*Math.PI)*20})},

    if(was&&!s){r.x=r.tent.x+40;r.y=r.tent.y+20;startAnim(r,'pop');r.state='idle';r.until=performance.now()+1200}}
  const asleep=!!r.sleep;r.el.style.display=asleep?'none':'';r.tentEl.style.display=asleep?'':'none';
  if(asleep){const lb=$('#tl_'+r.id);if(lb)lb.textContent=`${p.name}・${r.sleep.label} ${r.sleep.icon}`;return}
  const s=petScale(r.y),w=215*s;
  Object.assign(r.el.style,{left:((r.x-w/2)/RW*100)+'%',top:((r.y-w*(r.ar||1))/RH*100)+'%',width:(w/RW*100)+'%',zIndex:Math.round(r.y)});
  let dy=r.state==='walk'?-Math.abs(Math.sin(r.hop))*(r.fast?20:14)*s:0,dx=0,sq=r.state==='happy'?1+Math.sin(r.hop*2)*0.06:1,sx=1,rot=r.fast?r.facing*8:0;

function tick(now){

const PROMPT_BODY=p=>`請參考我附的寵物照片，把牠畫成 3D 黏土質感的 Q 版遊戲角色，保留牠的毛色、花紋和特徵。${p.species?`（牠是一隻${p.species}${p.breed?'，品種是'+p.breed:''}）`:''}

【姿勢】
- 全身入鏡，包括耳朵、四隻腳和尾巴，不能被切到
- 站姿，身體朝向畫面右邊、臉微微轉向前方（3/4 側面）
- 頭大身體小的 Q 版比例，大眼睛、表情可愛

【背景（很重要）】
- 背景必須是純綠色 #00FF00，整片均勻，不要漸層
- 不要地板、不要陰影、不要任何其他物件
- 寵物身上不要有綠色

【規格】
- 正方形 1:1
- 寵物置中，腳底在畫面約 90% 高度的位置，四周留一點空白
- 不要任何文字`;
async function fileToImg(file){const url=URL.createObjectURL(file);try{return await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url})}finally{setTimeout(()=>URL.revokeObjectURL(url),1000)}}
async function makeHead(file){
  const img=await fileToImg(file);const side=Math.min(img.width,img.height),c=document.createElement('canvas');c.width=c.height=240;
  c.getContext('2d').drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,240,240);return c.toDataURL('image/jpeg',0.82);
}
async function makeBody(file){
  const img=await fileToImg(file);const W=Math.min(900,img.width),H=Math.round(img.height*W/img.width);
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.drawImage(img,0,0,W,H);
  const d=x.getImageData(0,0,W,H),a=d.data;
  // 判斷：已透明？綠底？其他底色？
  let tr=0,gr=0,cn=0;const corners=[[2,2],[W-3,2],[2,H-3],[W-3,H-3],[W>>1,2]];
  for(const [cx,cy] of corners){const i=(cy*W+cx)*4;cn++;if(a[i+3]<30)tr++;else if(a[i+1]>150&&a[i+1]-Math.max(a[i],a[i+2])>70)gr++}
  let mode='none';
  if(tr>=3)mode='alpha';else if(gr>=3){mode='green';
    for(let i=0;i<a.length;i+=4){const r=a[i],g=a[i+1],b=a[i+2],m=Math.max(r,b),k=(g-m)/255;
      let al=1-(k-0.12)/0.2;al=Math.max(0,Math.min(1,al));a[i+3]=Math.round(a[i+3]*al);if(g>m)a[i+1]=Math.min(g,m+6)}
    x.putImageData(d,0,0)}
  // 裁掉透明邊
  const d2=x.getImageData(0,0,W,H).data;let x0=W,y0=H,x1=0,y1=0;
  for(let yy=0;yy<H;yy+=2)for(let xx=0;xx<W;xx+=2){if(d2[(yy*W+xx)*4+3]>40){if(xx<x0)x0=xx;if(xx>x1)x1=xx;if(yy<y0)y0=yy;if(yy>y1)y1=yy}}
  if(x1<=x0||y1<=y0){x0=0;y0=0;x1=W-1;y1=H-1}
  const cw=x1-x0+1,ch=y1-y0+1,OW=420,OH=Math.round(ch*OW/cw),o=document.createElement('canvas');o.width=OW;o.height=OH;
  o.getContext('2d').drawImage(c,x0,y0,cw,ch,0,0,OW,OH);
  let url=o.toDataURL('image/webp',0.85);if(!url.startsWith('data:image/webp'))url=o.toDataURL('image/png');
  return {url,mode};
}

function sparkline(ws){
  ws=ws.slice().sort((a,b)=>a.date.localeCompare(b.date)).slice(-12);
  if(ws.length<2)return '';
  const W=300,H=90,P=16,v=ws.map(w=>w.kg),pad=Math.max(0.05,(Math.max(...v)-Math.min(...v))*0.2),mn=Math.min(...v)-pad,mx=Math.max(...v)+pad;
  const X=i=>P+(W-2*P)*i/(ws.length-1),Y=x=>H-P-(H-2*P)*(x-mn)/(mx-mn),L=ws.length-1;
  const d=ws.map((w,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(w.kg).toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="體重變化">
    <path d="${d} L${X(L)} ${H-P} L${X(0)} ${H-P} Z" style="fill:color-mix(in srgb,var(--cc,#ff9a6b) 22%,#fff)"/><path d="${d}" style="fill:none;stroke:var(--cc,#ff9a6b)" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="${X(L)}" cy="${Y(ws[L].kg)}" r="4" style="fill:var(--cc,#ff9a6b)"/>
    <text x="${X(0)}" y="${H-2}" font-size="10" fill="#a08670">${ws[0].date.slice(0,7)}</text><text x="${X(L)}" y="${H-2}" font-size="10" fill="#a08670" text-anchor="end">${ws[L].date.slice(0,7)}</text>

}

      <div class="idstat">🍖 飽足 ${bar(fullness(p),'var(--cc)')}</div><div class="idstat">💛 心情 ${bar(mood(p,h),'#f4c542')}</div>
      ${(()=>{const s=sleepState(p);return s?`<div class="idstat">${s.icon} 現在${s.label==='賴床中'?'賴床中':'在睡'+(s.label==='晚安'?'覺':s.label)}</div>`:''})()}
      <div class="stamp">毛很多<br>認證</div></div>
  </div>
  ${fam?`<div class="row2"><button id="ied">✏️ 編輯資料</button></div>`:''}
  <div class="sec"><h4>⚖️ 體重 ${fam?'<button data-add="weights">＋ 記錄</button>':'<span>公開</span>'}</h4>${sparkline(ws)}${fam?recList('weights',ws,fam):(ws.length?'':'<div class="locked">還沒有紀錄</div>')}</div>
  <div class="sec"><h4>🩺 醫療紀錄 ${fam?'<button data-add="medical">＋ 新增</button>':'<span>🔒 家人限定</span>'}</h4>${fam?recList('medical',md,fam):'<div class="locked">家人才看得到</div>'}</div>
  <div class="sec"><h4>💰 支出 ${fam?'<button data-add="expenses">＋ 記一筆</button>':'<span>🔒 家人限定</span>'}</h4>
    ${fam?`<div style="font-size:13px;color:var(--soft);margin-bottom:4px">本月 ${money(month)}・醫療費用會自動算進來</div>${recList('expenses',ex.map(e=>e.fromMed?{...e,id:''}:e),fam).replace(/<button class="x" data-k="expenses" data-id="">刪除<\/button>/g,'')}`:'<div class="locked">家人才看得到</div>'}</div>
  <div class="row2" style="margin-top:14px"><button data-close>關閉</button></div>`,false,p.card||'#ff9a6b');
  if($('#ied'))$('#ied').onclick=()=>petForm(p.houseId,pid);
  $('#sheet').querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>recForm(pid,b.dataset.add));
  $('#sheet').querySelectorAll('.rec .x').forEach(b=>b.onclick=async()=>{if(!armBtn(b,'確定？'))return;
    try{await call('deleteRecord',Object.assign(cred(),{kind:b.dataset.k,id:b.dataset.id}))}catch(e){toast(e.message);return}
    DB[b.dataset.k]=DB[b.dataset.k].filter(x=>x.id!==b.dataset.id);idCard(pid);toast('已刪除')});
}
function recForm(pid,kind){
  const p=pet(pid),T=todayTW();let inner='',title='';
  if(kind==='weights'){title=`⚖️ ${esc(p.name)} 的體重`;inner=`<div class="two">${fld('rd','日期',`<input id="rd" type="date" max="${T}" value="${T}">`)}${fld('rv','體重（公斤）',`<input id="rv" type="number" step="0.01" min="0" inputmode="decimal">`)}</div><div class="hint">今天登記今天的體重，才會算進「量體重」任務喔</div>`}
  if(kind==='medical'){title=`🩺 ${esc(p.name)} 的醫療紀錄`;inner=`<div class="field"><div class="flabel">類型</div>${choiceGroup('rt',MED_TYPES,'看診')}</div>
    <div class="two">${fld('rd','日期',`<input id="rd" type="date" value="${T}">`)}${fld('rc','費用（可不填）',`<input id="rc" type="number" min="0" inputmode="numeric">`)}</div>
    ${fld('rti','內容',`<input id="rti" maxlength="30" placeholder="例如：三合一疫苗、皮膚過敏">`)}
    <div class="two">${fld('rcl','醫院',`<input id="rcl" maxlength="20">`)}${fld('rn','下次回診',`<input id="rn" type="date">`)}</div>`}
  if(kind==='expenses'){title=`💰 ${esc(p.name)} 的支出`;inner=`<div class="field"><div class="flabel">分類</div>${choiceGroup('rt',EXP_CATS,'飼料')}</div>
    <div class="two">${fld('rd','日期',`<input id="rd" type="date" value="${T}">`)}${fld('rv','金額',`<input id="rv" type="number" min="0" inputmode="numeric">`)}</div>
    ${fld('rno','備註',`<input id="rno" maxlength="30" placeholder="例如：主食罐一箱">`)}`}
  openModal(`<h3>${title}</h3>${inner}<div class="err" id="rerr"></div><div class="row2"><button id="rback">返回</button><button class="primary" id="rok">儲存</button></div>`,false,p.card||'#ff9a6b');
  if($('#rt'))bindChoice('rt');
  $('#rback').onclick=()=>idCard(pid);
  $('#rok').onclick=async()=>{const date=$('#rd').value||T,base={petId:pid,date,by:DB.me.nick};let rec,late=false;
    if(kind==='weights'){const v=parseFloat($('#rv').value);if(!(v>0)){$('#rerr').textContent='請填體重';return}late=date!==T;rec={...base,kg:Math.round(v*100)/100,late:late?'1':''}}
    if(kind==='medical')rec={...base,type:choiceVal('rt'),cost:Math.max(0,parseFloat($('#rc').value)||0),title:$('#rti').value.trim(),clinic:$('#rcl').value.trim(),next:$('#rn').value};
    if(kind==='expenses'){const a=parseFloat($('#rv').value);if(!(a>0)){$('#rerr').textContent='請填金額';return}rec={...base,cat:choiceVal('rt'),amount:a,note:$('#rno').value.trim()}}
    let saved;try{saved=await call('addRecord',Object.assign(cred(),{kind,rec}))}catch(e){$('#rerr').textContent=e.message;return}
    if(ONLINE){DB[kind].push(saved);if(kind==='weights')feedPush(`${p.name} 量了體重 ⚖️`)}
    if(kind==='weights'&&!late&&DB.game.weightDay!==T){DB.game.weightDay=T;progress('weight')}
    toast('記好了 ✨');idCard(pid)};
}

// ================= 我的設定 =================
$('#me').onclick=()=>{
  if(!DB.me)return onboarding();
  const h=myHouse();
  openModal(`<h3>🙂 ${esc(DB.me.nick)}</h3><p class="lead">${h?`你是「${esc(h.name)}」的家人`:'你還沒有家，正在島上逛逛'}</p>
    ${fld('mn','暱稱',`<input id="mn" maxlength="12" value="${esc(DB.me.nick)}">`)}
    <div class="row2"><button class="primary" id="msave">儲存暱稱</button></div>
    <div class="big3" style="margin-top:14px">
      ${h?`<button id="mhome"><span class="e">🏠</span><span>回我家<small>${esc(h.name)}</small></span></button>`:`<button id="mbuild"><span class="e">🏠</span><span>蓋我的家<small>選一塊空地</small></span></button><button id="mjoin"><span class="e">🔑</span><span>加入家人的家<small>需要家人密碼</small></span></button>`}
    </div>
    <div class="row2" style="margin-top:14px"><button data-close>關閉</button></div>`);
  $('#msave').onclick=async()=>{const n=$('#mn').value.trim();if(!n)return toast('暱稱不能空白');
    try{await call('savePlayer',{player:{id:DB.me.id,nick:n,game:DB.game}})}catch(e){toast(e.message);return}DB.me.nick=n;save();closeModal();toast('暱稱改好了')};
  if($('#mhome'))$('#mhome').onclick=()=>{closeModal();openHome(h.id)};
  if($('#mbuild'))$('#mbuild').onclick=()=>{closeModal();picking=true;renderIsland();toast('點一塊「＋」空地')};
  if($('#mjoin'))$('#mjoin').onclick=()=>joinFlow();
};

// ================= 任務・抽卡 =================
const RAR={N:{name:'普通',color:'#c9a47a',glow:'rgba(255,230,190,.5)',w:70},R:{name:'稀有',color:'#5b9bd5',glow:'rgba(120,190,255,.8)',w:25},SSR:{name:'超稀有',color:'#e8a400',glow:'rgba(255,215,90,1)',w:5}};
const CARDS=[
  {id:'study',name:'午後書房',r:'N'},{id:'garden',name:'陽光花園房',r:'N'},{id:'cafe',name:'貓咪咖啡廳',r:'N'},{id:'beach',name:'海邊小木屋',r:'N'},
  {id:'sakura',name:'櫻花和室',r:'R'},{id:'forest',name:'蘑菇森林房',r:'R'},{id:'cloud',name:'雲朵房間',r:'R'},{id:'xmas',name:'聖誕小屋',r:'R'},
  {id:'ocean',name:'海底房間',r:'SSR'},{id:'star',name:'星空閣樓',r:'SSR'},{id:'space',name:'太空艙',r:'SSR'},
].map(c=>Object.assign(c,{img:`assets/room_card_${c.id}.webp`}));
const MISSIONS=[
  {k:'poop',ic:'💩',name:'鏟屎',goal:10,rule:'清任何人家的便便'},
  {k:'note',ic:'📝',name:'留言',goal:5,rule:'在別人家貼便利貼（自己家不算）・每天最多算 3 則'},
  {k:'feed',ic:'🍖',name:'餵飯',goal:5,rule:'同一個家每 2 小時算 1 次'},
  {k:'weight',ic:'⚖️',name:'量體重',goal:5,rule:'當天登記才算・一天算 1 次'},
];
const owned=hid=>new Set((DB.owned[hid]||[]).filter(id=>CARDS.some(c=>c.id===id)));
function cardArt(c){return `<img src="${c.img}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">`}
function updTix(){const n=DB.game.tickets;$('#tixn').textContent=n;$('#tixn').style.display=n?'flex':'none'}
function progress(k){const m=MISSIONS.find(x=>x.k===k),g=DB.game;g.prog[k]=(g.prog[k]||0)+1;
  if(g.prog[k]>=m.goal){g.prog[k]=0;g.tickets++;setTimeout(()=>toast(`🎟️ ${m.name}任務完成！獲得 1 張抽卡券`),1200)}save();updTix()}
function missionStatus(k){
  const g=DB.game,d=todayTW(),now=Date.now();
  if(k==='poop'){const n=DB.houses.reduce((a,h)=>a+(isFamily(h.id)?0:(h.poops||[]).length),0);return n?`島上現在有 ${n} 坨便便等你清 🧹`:'大家家裡都很乾淨，晚點再來看看'}
  if(k==='note'){const n=g.noteDay[0]===d?g.noteDay[1]:0;return n>=3?'今天已達上限 ✅ 明天再來':`今天已算 ${n} / 3 則`}
  if(k==='feed'){const cd=Object.entries(g.feedAt||{}).filter(([h,t])=>now-t<2*HOUR&&house(h));return cd.length?`冷卻中：${cd.map(([h,t])=>`${house(h).name}（還要 ${Math.ceil((2*HOUR-(now-t))/60000)} 分）`).join('、')}`:'現在去任何一家餵飯都會算'}
  if(k==='weight')return g.weightDay===d?'今天已完成 ✅':'今天還沒量喔';
}
function missionsSheet(){
  if(!DB.me)return onboarding();
  const h=myHouse(),own=h?owned(h.id):new Set(),g=DB.game;
  openModal(`<h3>🎟️ 任務與抽卡</h3>
  <div class="tk"><div><div style="font-size:13px;color:var(--soft)">我的抽卡券</div><div class="n">${g.tickets} 張</div></div><button id="draw" ${g.tickets&&h?'':'disabled'}>開卡包</button></div>
  ${h?'':'<div class="hint" style="text-align:center;margin:-4px 0 10px">有家之後才能開卡包，券會先幫你存著</div>'}
  <div class="sec" style="margin-top:0"><h4>📋 任務<span>完成就送 1 張券</span></h4><div class="ms">
  ${MISSIONS.map(m=>`<div class="m"><span class="ic">${m.ic}</span><span>${m.name} ${m.goal} 次</span><span class="num">${g.prog[m.k]||0} / ${m.goal}</span>
    <div class="bar2"><i style="width:${(g.prog[m.k]||0)/m.goal*100}%"></i></div><small>${m.rule}</small><small class="st">${missionStatus(m.k)}</small></div>`).join('')}</div></div>
  ${h?`<div class="sec"><h4>🏠 ${esc(h.name)}・房間收藏<span>${own.size} / ${CARDS.length}</span></h4>
  <div class="coll">${ROOMS.map(([k,n])=>`<div class="mini" style="--rc:#d8c8b4" title="${n}（初始）"><div class="art">${`<img src="${roomImg(k)}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">`}</div><em>初始</em></div>`).join('')}
  ${CARDS.map(c=>{const o=own.has(c.id);return `<div class="mini ${o?'':'locked'}" style="--rc:${RAR[c.r].color}" title="${o?c.name:'未收集'}"><div class="art">${cardArt(c)}</div>${o?'':'<span>？</span>'}</div>`}).join('')}</div>
  <div class="hint">外框：<span style="color:${RAR.N.color}">■ 普通</span>　<span style="color:${RAR.R.color}">■ 稀有</span>　<span style="color:${RAR.SSR.color}">■ 超稀有</span>・不會抽到重複的・在「⚙️ 家」可以換房間</div></div>`:''}
  <div class="row2" style="margin-top:14px"><button data-close>關閉</button></div>`);
  $('#draw').onclick=()=>{closeModal();openPack()};
}
function openPack(){
  const h=myHouse();if(!h)return;const own=owned(h.id),left=CARDS.filter(c=>!own.has(c.id));
  if(!left.length)return toast('房間全部收集完了！券先幫你存著 🎉');
  const avail=Object.keys(RAR).filter(r=>left.some(c=>c.r===r));let x=Math.random()*avail.reduce((a,r)=>a+RAR[r].w,0),r=avail[0];
  for(const k of avail){if((x-=RAR[k].w)<0){r=k;break}}
  const pool=left.filter(c=>c.r===r),c=pool[Math.floor(Math.random()*pool.length)];
  const ftxt=`${DB.me.nick} 為 ${h.name} 抽到了 ${c.r==='SSR'?'✨超稀有・':c.r==='R'?'稀有・':''}${c.name}${c.r==='SSR'?'✨':''}`;
  DB.game.tickets--;own.add(c.id);DB.owned[h.id]=[...own];save();updTix();
  call('drawCard',Object.assign(cred(),{cardId:c.id,feedText:ftxt}),true).catch(e=>toast('收藏沒存到：'+e.message));
  const ov=document.createElement('div');ov.className='gacha';ov.innerHTML=`<div class="rays" id="rays"></div><div class="hint2" id="gh">點卡包撕開</div>
    <div class="stage-area"><div class="pack" id="pk" role="button" aria-label="撕開卡包"><div class="pbody"><img class="plogo" src="assets/logo.webp" alt=""></div><div class="ptop"></div></div>
      <div class="card" id="cd" style="--rc:${RAR[c.r].color};--glow:${RAR[c.r].glow}"><div class="in"><div class="face back"></div>
        <div class="face front"><div class="art">${cardArt(c)}</div><div class="cap"><b>${'★'.repeat(c.r==='SSR'?3:c.r==='R'?2:1)} ${RAR[c.r].name}</b><span>${c.name}</span></div></div></div></div></div>
    <div class="gbtns" id="gb"><button id="guse" class="primary">換上這間</button><button id="gok">收進收藏</button><button id="gmore">再抽一次</button></div>`;
  document.body.appendChild(ov);const pk=ov.querySelector('#pk'),cd=ov.querySelector('#cd'),gh=ov.querySelector('#gh');let st=0;
  pk.onclick=()=>{if(st)return;st=1;gh.textContent='';pk.classList.add('shake');setTimeout(()=>{pk.classList.remove('shake');pk.classList.add('torn')},900);setTimeout(()=>{pk.classList.add('gone');cd.classList.add('up');gh.textContent='點卡片翻開';st=2},1500)};
  cd.onclick=()=>{if(st!==2)return;st=3;gh.textContent='';cd.classList.add('flip');
    setTimeout(()=>{if(c.r!=='N'){ov.querySelector('#rays').classList.add('on');burst(ov,c.r==='SSR'?28:14)}
      gh.textContent=c.r==='SSR'?'✨ 超稀有！ ✨':c.r==='R'?'稀有卡！':'抽到新房間';ov.querySelector('#gb').classList.add('on');ov.querySelector('#gmore').style.display=DB.game.tickets?'':'none';
      if(ONLINE)feedPush(ftxt)},700)};
  ov.querySelector('#guse').onclick=async()=>{const b=ov.querySelector('#guse');b.disabled=true;b.textContent='換房間中…';
    try{await call('updateHouse',Object.assign(cred(),{patch:{room:c.id}}),true);h.room=c.id;ov.remove();toast(`已經換成「${c.name}」🏠`);openHome(h.id)}
    catch(e){b.disabled=false;b.textContent='換上這間';toast(e.message)}};
  ov.querySelector('#gok').onclick=()=>{ov.remove();toast(`已收進「${h.name}」的房間收藏`)};
  ov.querySelector('#gmore').onclick=()=>{ov.remove();openPack()};
}
function burst(ov,n){for(let i=0;i<n;i++){const s=document.createElement('div');s.className='sp';s.textContent=['✨','⭐','💖','🌟'][i%4];
  const a=Math.random()*Math.PI*2,d=120+Math.random()*120;s.style.left='50%';s.style.top='50%';s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');
  s.style.animationDelay=(Math.random()*.3)+'s';ov.appendChild(s);setTimeout(()=>s.remove(),1700)}}
$('#tix').onclick=missionsSheet;

// ================= 動態 =================
let fi=0;
function tickerShow(){const el=$('#ticker');if(!DB.feed.length){el.style.display='none';return}el.style.display='';el.style.opacity=0;
  setTimeout(()=>{const f=DB.feed[fi%Math.min(DB.feed.length,8)];el.textContent='📣 '+f.t;el.style.opacity=1},300)}
setInterval(()=>{fi++;tickerShow()},3500);
$('#ticker').onclick=()=>openModal(`<h3>📣 島上動態</h3><div style="background:#fff;border:2px solid var(--line);border-radius:16px;padding:2px 12px;margin-top:10px">
  ${DB.feed.slice(0,40).map(f=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px dashed var(--line);font-size:14px"><span>${esc(f.t)}</span><span style="color:#a08670;font-size:12px;white-space:nowrap">${ago(f.at)}</span></div>`).join('')}
  </div><div class="row2" style="margin-top:14px"><button data-close>關閉</button></div>`);

document.addEventListener('error',e=>{const t=e.target;if(t.tagName==='IMG'&&!t.dataset.fb&&/googleusercontent/.test(t.src)){t.dataset.fb=1;t.src='assets/pet_head_other.webp'}},true);
// ================= 頁尾與啟動 =================
function renderFoot(){
  if(ONLINE){$('#foot').innerHTML='毛很多・資料存在雲端，朋友之間會互相看到。畫面不是即時的，回到小島或過一分鐘會自動更新。';return}
  $('#foot').innerHTML=`試做版：資料只存在這支手機的瀏覽器裡，別人看不到，之後接上 Google 試算表才會共用。示範家庭的家人密碼都是 1234。<br><button id="reset">清除試做資料、從頭開始</button>`;
  $('#reset').onclick=e=>{if(!armBtn(e.target,'所有試做資料都會清掉，再按一次'))return;try{localStorage.removeItem(KEY)}catch(err){}DB=seed();save();picking=false;renderIsland();renderFoot();onboarding()};
}
renderIsland();renderFoot();tickerShow();setInterval(()=>{if(mode==='auto'&&!$('#island').classList.contains('hidden'))renderIsland()},60000);
if(ONLINE){
  busy(true);sync().finally(()=>{busy(false);if(!DB.me)onboarding()});
  setInterval(()=>{if(document.visibilityState==='visible'&&$('#modal').classList.contains('hidden'))sync(true)},45000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')sync(true)});
}else if(!DB.me)setTimeout(onboarding,400);
</script>
