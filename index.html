<style>
:root{--ink:#5a4030;--soft:#9a8270;--cream:#fffaee;--line:#efe1cc;--wood:#b98d62;--accent:#ff9a6b;--accent-d:#e07a4c;--night:#2b2b38;--danger:#d9534f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--night);font-family:"Huninn","PingFang TC","Noto Sans TC",sans-serif;color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stage{position:relative;width:100%;max-width:520px;margin:0 auto;overflow:hidden;user-select:none;-webkit-user-select:none}
.island{aspect-ratio:1024/2076;max-width:min(520px,calc((100lvh - env(safe-area-inset-top)) * 1024 / 2076));background:#a9def0}
.home{aspect-ratio:2/3;background:#f3dcc0;container-type:inline-size}
.hidden{display:none!important}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.island .bg{opacity:0;transition:opacity 1.2s ease}
.island .bg.on{opacity:1}
.thing{position:absolute;transform:translate(-50%,-100%);cursor:pointer;transition:transform .15s}
.thing img{display:block;width:100%;height:auto;pointer-events:none}
.thing:active{transform:translate(-50%,-100%) scale(.94)}
.thing.pick{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{filter:drop-shadow(0 0 0 #fff)}50%{filter:drop-shadow(0 0 10px #fff) brightness(1.15)}}
.label{position:absolute;transform:translate(-50%,0);white-space:nowrap;pointer-events:none;
  font-size:clamp(10px,2.7vw,13px);padding:2px 9px;border-radius:999px;background:rgba(255,250,238,.93);
  border:1.5px solid var(--wood);color:#6b4b33;box-shadow:0 1px 0 rgba(0,0,0,.12)}
.label.mine{background:#fff0e6;border-color:var(--accent);color:#b4532a}
.label.lot{background:rgba(255,255,255,.85);border-style:dashed;color:#7a5a40;padding:0;width:1.9em;height:1.9em;display:flex;align-items:center;justify-content:center;font-size:clamp(13px,3.6vw,17px)}
.bubble{position:absolute;transform:translate(-50%,-100%);font-size:clamp(14px,4.4vw,22px);background:#fff;border-radius:50%;
  width:2em;height:2em;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 rgba(0,0,0,.15);
  animation:bob 1.8s ease-in-out infinite;pointer-events:none}
.bubble::after{content:"";position:absolute;bottom:-5px;left:50%;margin-left:-5px;border:5px solid transparent;border-top-color:#fff;border-bottom:0}
.top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;pointer-events:none;z-index:3000}
.top>*{pointer-events:auto}
.title{font-size:clamp(26px,8vw,38px);color:#fff;letter-spacing:3px;pointer-events:none!important;
  text-shadow:-2px -2px 0 #8a5a3a,2px -2px 0 #8a5a3a,-2px 2px 0 #8a5a3a,2px 2px 0 #8a5a3a,0 4px 0 #8a5a3a}
.topright{display:flex;gap:10px;align-items:center}
.logo{width:40%;max-width:210px;height:auto;pointer-events:none!important;filter:drop-shadow(0 3px 2px rgba(60,35,15,.35))}
.circle{position:relative;width:46px;height:46px;border-radius:50%;background:#fff6e6;border:3px solid #fff;box-shadow:0 0 0 2px var(--wood);
  display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden;padding:0}
.circle img{width:100%;height:100%;object-fit:cover;border-radius:50%}
#tix,#bell,#me{overflow:visible}
.circle{width:42px;height:42px;font-size:20px}
.badge{position:absolute;right:-6px;top:-6px;min-width:20px;height:20px;border-radius:10px;background:#ff5e5e;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;padding:0 4px;z-index:2}
.ticker{position:absolute;left:14px;right:14px;bottom:8.6%;z-index:3000;background:rgba(255,250,238,.92);border:1.5px solid var(--wood);border-radius:999px;
  padding:4px 12px;font-size:clamp(11px,3.1vw,13px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.12);transition:opacity .3s}
.pickbar{position:absolute;left:50%;bottom:9.5%;transform:translateX(-50%);z-index:3001;background:var(--accent);color:#fff;border-radius:14px;padding:8px 14px;font-size:14px;display:flex;gap:10px;align-items:center;white-space:nowrap;box-shadow:0 3px 0 var(--accent-d)}
.pickbar button{border:0;background:rgba(255,255,255,.25);color:#fff;border-radius:10px;padding:3px 10px}
.bar{position:absolute;left:50%;bottom:2.2%;transform:translateX(-50%);display:flex;gap:4px;background:rgba(255,250,238,.92);
  padding:4px;border-radius:999px;box-shadow:0 2px 0 rgba(0,0,0,.15);z-index:3000}
.bar button{border:0;background:transparent;color:#7a5a40;font-size:13px;padding:6px 10px;border-radius:999px;white-space:nowrap}
.bar button.on{background:var(--accent);color:#fff}
/* home */
.pill{border:2px solid var(--wood);background:rgba(255,250,238,.94);border-radius:999px;padding:6px 14px;font-size:15px;box-shadow:0 2px 0 rgba(0,0,0,.12);white-space:nowrap}
.housename{font-size:clamp(15px,4.4vw,19px);padding:6px 14px;max-width:48%;overflow:hidden;text-overflow:ellipsis;text-align:center}
.pet{position:absolute;transform-origin:50% 100%;cursor:pointer}
.pet .body{display:block;transform-origin:50% 100%}
.pet img{display:block;width:100%;height:auto;pointer-events:none}
.pet .emoji{display:block;text-align:center;line-height:1;pointer-events:none}
.pet .shadow{position:absolute;left:12%;right:12%;bottom:-4%;height:12%;border-radius:50%;background:rgba(90,55,25,.22);filter:blur(3px);z-index:-1}
.pet .nm{position:absolute;left:50%;bottom:-1.6em;transform:translateX(-50%);font-size:clamp(10px,2.6cqw,13px);background:rgba(255,250,238,.85);border-radius:999px;padding:0 7px;white-space:nowrap;pointer-events:none}
.poop{position:absolute;transform:translate(-50%,-100%);font-size:clamp(22px,7vw,34px);cursor:pointer;line-height:1;padding:6px;border:0;background:transparent;filter:drop-shadow(0 3px 2px rgba(90,55,25,.3))}
.bowl{position:absolute;transform:translate(-50%,-100%);font-size:clamp(26px,8vw,40px);line-height:1;filter:drop-shadow(0 3px 2px rgba(90,55,25,.3))}
.fx img{width:clamp(28px,9vw,44px);height:auto;display:block}.tent .zz i img{width:clamp(14px,4.5cqw,24px);display:block}
.ii.ic{width:1.3em;height:1.3em;font-size:1em;vertical-align:-.28em;margin:0 .05em}.circle .ii.ic{width:26px;height:26px}.act .ii.ic{width:1.45em;height:1.45em}
.fx{position:absolute;pointer-events:none;font-size:clamp(16px,5vw,24px);animation:float 1.3s ease-out forwards;z-index:2500}
@keyframes float{0%{opacity:0;transform:translate(-50%,0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-70px) scale(1.15)}}
.board{position:absolute;display:grid;grid-template-columns:repeat(3,1fr);gap:4%;padding:3%}
.note{aspect-ratio:1;border:0;padding:6%;font-size:clamp(8px,2.2vw,11px);line-height:1.25;text-align:left;overflow:hidden;
  box-shadow:0 2px 3px rgba(0,0,0,.18);color:#5a4030;display:flex;flex-direction:column;justify-content:space-between}
.note small{font-size:.85em;opacity:.7;text-align:right}
.note.empty{background:transparent!important;box-shadow:none;border:1.5px dashed rgba(122,90,64,.45);color:#8a6a50;align-items:center;justify-content:center;font-size:clamp(12px,3.4vw,16px)}
.empty-home{position:absolute;left:50%;top:72%;transform:translate(-50%,-50%);background:rgba(255,250,238,.95);border:2px dashed var(--wood);border-radius:18px;padding:14px 18px;text-align:center;font-size:15px;line-height:1.6;width:70%}
.empty-home button{margin-top:8px;border:0;background:var(--accent);color:#fff;border-radius:12px;padding:8px 14px}
.actions{position:absolute;left:50%;bottom:2.4%;transform:translateX(-50%);display:flex;gap:5px;z-index:3000}
.actions .act{padding:7px 9px;font-size:14px}
.act{border:2px solid var(--wood);background:rgba(255,250,238,.95);border-radius:18px;padding:8px 13px;font-size:15px;box-shadow:0 3px 0 rgba(0,0,0,.15);white-space:nowrap}
.act:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
.famtools{position:absolute;right:12px;top:62px;display:flex;flex-direction:column;gap:8px;z-index:3000}
.famtools .act{font-size:13px;padding:6px 10px}
.petmenu{position:absolute;transform:translate(-50%,-100%);display:flex;gap:6px;background:#fff;padding:6px;border-radius:16px;box-shadow:0 3px 0 rgba(0,0,0,.15);z-index:2800}
.petmenu button{border:0;background:#fff3e2;border-radius:12px;padding:7px 10px;font-size:14px;white-space:nowrap}
/* modal */
.modal{position:fixed;inset:0;background:rgba(40,25,15,.45);display:flex;align-items:flex-end;justify-content:center;z-index:5000}
.sheet{background:var(--sheetbg,var(--cream));width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px 24px}
@media(min-width:600px){.modal{align-items:center}.sheet{border-radius:24px}}
.sheet h3{margin:0 0 4px;font-weight:normal;font-size:20px;text-align:center;text-wrap:balance}
.sheet .lead{text-align:center;color:var(--soft);font-size:14px;margin:0 0 14px;line-height:1.6}
.field{margin-bottom:12px}
.field label,.flabel{display:block;font-size:13px;color:var(--soft);margin:0 0 5px 4px}
.field input,.field select,.field textarea{width:100%;font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
.field textarea{min-height:70px;resize:vertical}
.field input{min-width:0;max-width:100%}
.field input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-height:46px;line-height:22px;text-align:left}
.field input[type=date]::-webkit-date-and-time-value{text-align:left}
.two{display:flex;gap:10px}.two>.field{flex:1;min-width:0}
.hint{font-size:12px;color:#a08670;margin:4px 4px 0;line-height:1.5}
.choices{display:flex;flex-wrap:wrap;gap:6px}
.choices button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:7px 11px;font-size:15px}
.choices button.on{border-color:var(--accent);background:#fff0e8}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:38px;height:38px;border-radius:50%;border:0;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.swatches button.on{outline:3px solid var(--ink);outline-offset:2px}
.big3{display:grid;gap:10px;margin-top:6px}
.big3 button{display:flex;gap:12px;align-items:center;text-align:left;border:2px solid var(--line);background:#fff;border-radius:16px;padding:12px 14px;font-size:16px}
.big3 button .e{font-size:30px}
.big3 button small{display:block;color:var(--soft);font-size:12px;margin-top:2px}
.styles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.styles button{min-width:0;overflow:hidden;position:relative;border:2px solid var(--line);background:#fff;border-radius:12px;padding:4px;aspect-ratio:1}
.styles button img{display:block;width:100%;height:100%;min-width:0;object-fit:contain}
.styles button.on{border-color:var(--accent);background:#fff0e8;box-shadow:0 0 0 2px var(--accent)}
.styles button:disabled{opacity:.45;cursor:not-allowed}
.styles button:disabled::after{content:"已有人住";position:absolute;left:50%;bottom:3px;transform:translateX(-50%);font-size:10px;background:#7a6050;color:#fff;border-radius:8px;padding:1px 6px;white-space:nowrap}
.rooms{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rooms button{min-width:0;border:2px solid var(--line);background:#fff;border-radius:12px;padding:4px;display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--soft)}
.rooms button img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px}
.rooms button.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent);color:var(--ink)}
.steps{display:flex;justify-content:center;gap:6px;margin:6px 0 12px}
.steps i{width:22px;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--accent)}
.row2{display:flex;gap:10px;margin-top:10px}
.row2.sticky{position:sticky;bottom:-24px;margin:10px -16px -24px;padding:10px 16px 18px;background:var(--sheetbg,var(--cream));box-shadow:0 -6px 10px -8px rgba(90,60,30,.25);z-index:2}
.row2 button{flex:1;padding:12px;border-radius:14px;font-size:16px;border:2px solid var(--line);background:#fff}
.row2 .primary{background:var(--accent);border-color:var(--accent);color:#fff}
.row2 .primary:disabled{background:#d9cbbb;border-color:#d9cbbb}
.err{color:var(--danger);font-size:13px;min-height:18px;text-align:center;margin-top:4px}
.count{font-size:12px;color:var(--soft);text-align:right;margin-top:4px}
.photo{display:flex;gap:12px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px}
.photo .pv{width:72px;height:72px;flex:none;border-radius:12px;background:#f6ecdd;display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden}
.photo .pv.round{border-radius:50%}
.photo .pv img{width:100%;height:100%;object-fit:contain}
.photo .pv.round img{object-fit:cover;object-position:50% 15%}
.photo .pv.check{background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0 0/14px 14px}
.photo .info{flex:1;font-size:13px;color:var(--soft);line-height:1.5}
.photo .btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.photo .btns label,.photo .btns button{border:2px solid var(--line);background:#fffaf2;border-radius:10px;padding:5px 9px;font-size:13px;color:var(--ink);cursor:pointer}
.prompt{background:#fff;border:2px dashed var(--line);border-radius:12px;padding:10px;font-size:12px;line-height:1.6;white-space:pre-wrap;color:#6b5545;max-height:180px;overflow:auto;user-select:text;-webkit-user-select:text}
details{margin-top:6px}
details summary{font-size:13px;color:var(--accent-d);cursor:pointer}
.visits{position:absolute;left:12px;top:60px;z-index:2900;background:rgba(255,250,238,.9);border-radius:12px;padding:3px 10px;font-size:12px;white-space:nowrap;max-width:58%;overflow:hidden;text-overflow:ellipsis;box-shadow:0 1px 0 rgba(0,0,0,.1)}
.nightdim{position:absolute;inset:0;background:rgba(20,25,60,.38);opacity:0;transition:opacity 1s;pointer-events:none}
.nightdim.on{opacity:1}
.poop{width:clamp(30px,9cqw,46px)}.poop img{width:100%;display:block;pointer-events:none}
.bowl{width:clamp(56px,15cqw,80px)}.bowl img{width:100%;display:block}
.tent{position:absolute;cursor:pointer}
.tent>img{display:block;width:100%;transform-origin:50% 100%;animation:breathe 3.2s ease-in-out infinite;filter:drop-shadow(0 4px 3px rgba(90,55,25,.25))}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,1.045)}}
.tent .zz{position:absolute;left:58%;top:30%;pointer-events:none}
.tent .zz i{position:absolute;font-style:normal;color:#7a68c8;font-size:clamp(12px,3.4cqw,18px);opacity:0;animation:zz 3s linear infinite;text-shadow:0 1px 0 #fff}
.tent .zz i:nth-child(2){animation-delay:1s}.tent .zz i:nth-child(3){animation-delay:2s}
@keyframes zz{0%{opacity:0;transform:translate(0,0) scale(.7)}20%{opacity:1}100%{opacity:0;transform:translate(22px,-40px) scale(1.3)}}
.tent .flag{position:absolute;left:-4%;top:28%;width:28%;aspect-ratio:1;border-radius:50%;overflow:hidden;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tent .flag img{width:100%;height:100%;object-fit:cover}
.tent .nm{position:absolute;left:50%;bottom:-1.7em;transform:translateX(-50%);font-size:clamp(10px,2.6cqw,13px);background:rgba(255,250,238,.9);border-radius:999px;padding:0 8px;white-space:nowrap}
.petmenu{flex-direction:column;align-items:stretch;min-width:150px}
.pm-h{display:flex;align-items:center;gap:6px;font-size:14px;padding:0 2px}
.pm-h .tr{font-size:11px;background:#fff0e0;color:#b4532a;border-radius:8px;padding:1px 6px}
.pm-s{display:flex;align-items:center;gap:6px;font-size:12px;padding:0 2px}
.sbar{flex:1;height:7px;border-radius:4px;background:#f1e6d8;overflow:hidden}.sbar i{display:block;height:100%;border-radius:4px}
.pm-b{display:flex;gap:6px}
.nb{display:block;width:100%;text-align:left;border:0;border-radius:6px;padding:12px;margin-bottom:8px;font-size:15px;line-height:1.5;box-shadow:0 2px 3px rgba(0,0,0,.12);color:#5a4030}
.nb small{display:block;font-size:12px;opacity:.7;margin-top:4px}
.m small.st{color:var(--accent-d)}
.mini em{position:absolute;left:3px;bottom:3px;font-style:normal;font-size:10px;background:rgba(255,255,255,.9);border-radius:6px;padding:0 4px;color:#7a6050}
.gbtns{flex-wrap:wrap;justify-content:center}
@media (prefers-reduced-motion:reduce){.tent>img,.tent .zz i{animation:none}}

.coinpop{position:fixed;right:18px;top:64px;z-index:9600;background:#fff3c4;color:#8a5a00;border:2px solid #f0c44c;border-radius:999px;padding:3px 10px;font-size:14px;animation:cp 1.5s ease-out forwards;pointer-events:none}
@keyframes cp{0%{opacity:0;transform:translateY(8px)}15%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
.tk.coin{background:#fffaf0}.tk.coin button{background:#f0b429;box-shadow:0 3px 0 #c98f12}
details.earn{margin:-4px 0 12px}details.earn .frow{font-size:13px}
.frow{display:flex;justify-content:space-between;gap:10px;padding:9px 2px;border-bottom:1px dashed var(--line);font-size:14px;line-height:1.4}
.frow .ago{color:#a08670;font-size:12px;white-space:nowrap}
.frow.mine{background:#fff6e0;border-radius:8px;padding:9px 8px}
.flist{background:#fff;border:2px solid var(--line);border-radius:16px;padding:2px 10px;margin-top:8px}
.ticker .unread{display:inline-flex;min-width:18px;height:18px;border-radius:9px;background:#ff5e5e;color:#fff;font-size:11px;font-weight:normal;align-items:center;justify-content:center;padding:0 4px;margin-right:2px}
b.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff5e5e;margin-right:6px;vertical-align:1px}
.steps2{margin:4px 0 0;padding-left:22px;line-height:2;font-size:15px}
.sibs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px}
.sibs button{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid transparent;background:none;border-radius:14px;padding:4px;font-size:12px;color:var(--soft)}
.sibs button img{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.sibs button.on{border-color:var(--cc,var(--accent));color:var(--ink)}
.photos{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.photos button,.phadd{aspect-ratio:1;border-radius:10px;overflow:hidden;border:0;padding:0;background:#f6ecdd;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--soft);cursor:pointer}
.photos img{width:100%;height:100%;object-fit:cover}
.phadd{border:2px dashed var(--line)}
.chk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.chk span{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;background:#f4ece0;color:#b0a090}
.chk span.on{background:var(--cc,#ff9a6b);color:#fff}.chk span.today{box-shadow:0 0 0 2px var(--cc,#ff9a6b)}
.cnt{display:flex;align-items:baseline;gap:6px}.cnt b{font-size:28px;font-weight:normal;color:var(--cc,#ff9a6b)}.cnt span{font-size:12px;color:var(--soft)}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;height:60px;margin-top:4px}
.bars span{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px}

.guide{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 10px}

.gstep{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;flex-wrap:wrap}

.gstep span{flex:1;min-width:120px}
.gstep button,.gstep a,.gstep label{border:2px solid var(--line);background:#fffaf2;border-radius:10px;padding:4px 10px;font-size:13px;color:var(--ink);text-decoration:none;cursor:pointer}
.visits div{overflow:hidden;text-overflow:ellipsis}

.label.shop{background:#ffe9a8;border-color:#e0a420;color:#7a5200}
.tabs3{display:flex;gap:4px;background:#f5e8d4;padding:4px;border-radius:14px;margin-bottom:10px}
.tabs3 button{flex:1;border:0;background:none;border-radius:11px;padding:8px 2px;font-size:13px;color:var(--soft)}
.tabs3 button.on{background:#fff;color:var(--ink);box-shadow:0 2px 0 var(--line)}
.shopgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.si{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.si.pick{cursor:pointer}.si.on{border-color:var(--accent);background:#fff0e8}
.si .sn{font-size:13px}.si .sf{font-size:10px;color:#a08670;min-height:14px;text-align:center}

.si button:disabled{background:#d9cbbb}.si small{font-size:10px;color:var(--soft);min-height:13px}
.ii{position:relative;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;font-size:22px;line-height:1;vertical-align:middle}
.ii img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:1}.ii img+b{visibility:hidden}.ii b{font-weight:normal}
.ii.big{width:52px;height:52px;font-size:38px}.ii.huge{width:110px;height:110px;font-size:80px}

.toy,.gift{position:absolute;transform:translate(-50%,-90%);width:clamp(40px,12cqw,64px);border:0;background:none;padding:0;cursor:pointer;filter:drop-shadow(0 3px 2px rgba(90,55,25,.3))}
.toy.flip .ii{transform:scaleX(-1)}
.gift{animation:giftbob 1.6s ease-in-out infinite}
@keyframes giftbob{0%,100%{transform:translate(-50%,-90%)}50%{transform:translate(-50%,-100%) rotate(-4deg)}}
.poop{padding:10px}
.broom{position:absolute;left:0;top:76%;font-size:clamp(40px,12cqw,64px);z-index:2700;animation:sweep 1.2s ease-in-out forwards;pointer-events:none}
@keyframes sweep{0%{left:-10%;transform:rotate(-20deg)}50%{transform:rotate(20deg)}100%{left:100%;transform:rotate(-20deg)}}
.giftopen{margin:6px auto 4px;animation:pop2 .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop2{from{transform:scale(.3)}to{transform:none}}
.pm-b button{padding:7px 8px}
.coinv{color:#b07800;font-weight:normal}

.lvbox{background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 14px;margin-bottom:12px}
.lvt{display:flex;justify-content:space-between;align-items:baseline}.lvt b{font-size:24px;font-weight:normal;color:#e86a92}.lvt span{font-size:13px;color:var(--soft)}
.xpbar{height:12px;border-radius:6px;background:#fbe3ea;overflow:hidden;margin:6px 0 4px}.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#ff8fab,#ff6f91);border-radius:6px}
.lvbox small{font-size:11px;color:#a08670}
.lvb{position:absolute;right:-8px;bottom:-6px;background:#ff6f91;color:#fff;font-size:10px;border-radius:8px;padding:0 4px;border:1.5px solid #fff;z-index:2;line-height:1.5}
.itemface{position:absolute;inset:0;background:radial-gradient(circle,#fffdf6,#fbe9cf);display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px;padding:10%}
.front.rainbow{border-image:linear-gradient(135deg,#ff8fab,#ffd36e,#7fd1b9,#64b5f6,#9b8cff) 1;border-width:6px;border-style:solid}
.si.locked2{opacity:.35;filter:grayscale(1)}
.tent.tuck>img{animation:tuck .8s ease-in-out}
@keyframes tuck{0%,100%{transform:none}30%{transform:scale(1.06,.94)}60%{transform:scale(.97,1.04)}}
.petheads{position:absolute;right:12px;top:142px;z-index:2900;display:flex;flex-direction:column;gap:6px}
.ph1{position:relative;width:38px;height:38px;border-radius:50%;padding:0;border:2.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.25);background:#fff1dc;overflow:visible}
.ph1 img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.ph1 i{position:absolute;right:-6px;bottom:-4px;font-style:normal;font-size:13px}
.actions .act{display:flex;flex-direction:column;align-items:center;gap:0;padding:4px 7px;font-size:12px;line-height:1.25}

.pill.cam{padding:6px 12px;font-size:17px}
.flash{position:fixed;inset:0;background:#fff;z-index:9900;animation:flash .45s ease-out forwards;pointer-events:none}

.shot{width:100%;border-radius:12px;display:block;box-shadow:0 3px 10px rgba(0,0,0,.15);-webkit-touch-callout:default;user-select:auto}
.dl{flex:1;padding:12px;border-radius:14px;font-size:16px;border:2px solid var(--line);background:#fff;color:var(--ink);text-align:center;text-decoration:none}
/* 身分證主題色：整個畫面跟著換 */
.sheet.themed{--sheetbg:color-mix(in srgb,var(--cc) 9%,#fffaf5)}
.sheet.themed .sec,.sheet.themed .idcard{border-color:color-mix(in srgb,var(--cc) 35%,#fff)}

.sheet.themed .rec{border-top-color:color-mix(in srgb,var(--cc) 25%,#fff)}
.sheet.themed .row2 button{border-color:color-mix(in srgb,var(--cc) 30%,#fff)}

.sheet.themed .field input:focus,.sheet.themed .field select:focus,.sheet.themed .field textarea:focus{border-color:var(--cc)}

.sheet.themed .idfields dt{color:color-mix(in srgb,var(--cc) 60%,#6a5a50)}
/* id card */
.idcard{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 3px 0 #e8d6bd;border:2px solid var(--line)}

.idbody{display:flex;gap:14px;padding:14px}
.idphoto{width:36%;flex:none;aspect-ratio:1;align-self:flex-start;border-radius:10px;overflow:hidden;background:#fff1dc;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:48px}

  display:flex;align-items:center;justify-content:center;font-size:11px;transform:rotate(-14deg);text-align:center;line-height:1.2}
.idbottom{position:relative;padding:0 80px 14px 14px;font-size:14px;color:#7a6050;min-height:64px}
.idstat{display:flex;align-items:center;gap:6px;font-size:12px;margin-top:6px;max-width:220px}
.trt{font-size:12px;background:color-mix(in srgb,var(--cc) 18%,#fff);color:color-mix(in srgb,var(--cc) 75%,#2a1a10);border-radius:8px;padding:1px 7px}
.sec{margin-top:14px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 12px}
.sec h4{margin:0 0 6px;font-weight:normal;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.sec h4 span{font-size:12px;color:#a08670}
.sec h4 button{border:0;background:#fff0e8;color:var(--accent-d);border-radius:10px;padding:4px 10px;font-size:13px}
.locked{color:#a08670;font-size:13px;text-align:center;padding:6px 0}
.rec{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px dashed var(--line);font-size:14px}
.rec .d{font-size:12px;color:var(--soft);width:78px;flex:none;font-variant-numeric:tabular-nums}
.rec .t{flex:1;min-width:0}
.rec .t small{display:block;color:var(--soft);font-size:12px}
.rec .v{white-space:nowrap;font-variant-numeric:tabular-nums}

.rec .x.armed{background:var(--danger);color:#fff}
.btn-d{width:100%;margin-top:12px;padding:11px;border-radius:14px;color:var(--danger);border:2px solid #f2c9c7;background:#fff}
.btn-d.armed{background:var(--danger);color:#fff}
#toast{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);background:rgba(70,50,35,.92);color:#fff;padding:12px 18px;
  border-radius:16px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;text-align:center;max-width:80%;z-index:9000}
#toast.show{opacity:1}

.deco{position:relative;width:86%;max-width:340px;margin:0 auto 6px}.deco img{width:100%;display:block}
.deco span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(18px,5.4vw,24px);color:#7a4a2a;padding-top:3%}
#busy{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:rgba(70,50,35,.9);color:#fff;padding:7px 14px;border-radius:999px;font-size:13px;z-index:9500}
.foot{max-width:520px;margin:0 auto;padding:14px 16px 30px;color:#e9ddd0;font-size:13px;line-height:1.7}
.foot button{border:1px solid #6a5a50;background:transparent;color:#e9ddd0;border-radius:10px;padding:4px 10px;font-size:12px;margin-top:6px}
/* missions & gacha */
.tk{display:flex;align-items:center;justify-content:space-between;background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.tk .n{font-size:28px;font-variant-numeric:tabular-nums}
.tk button{border:0;background:var(--accent);color:#fff;border-radius:14px;padding:10px 16px;font-size:16px;box-shadow:0 3px 0 var(--accent-d)}
.tk button:disabled{background:#d9cbbb;box-shadow:0 3px 0 #c4b4a2}
.ms{display:grid;gap:8px}
.m{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;font-size:14px}
.m .ic{font-size:20px;grid-row:span 2}
.m .bar2{grid-column:2/4;height:8px;background:#f2e6d6;border-radius:4px;overflow:hidden}
.m .bar2 i{display:block;height:100%;background:var(--accent);border-radius:4px}
.m .num{font-variant-numeric:tabular-nums;color:var(--soft);font-size:13px}

.coll{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mini{aspect-ratio:3/4;border-radius:8px;overflow:hidden;position:relative;border:3px solid var(--rc);background:#f2e6d6;display:flex;align-items:center;justify-content:center;color:#a08670;padding:0}
.mini .art{position:absolute;inset:0;font-size:26px}
.mini.locked .art{filter:grayscale(1) brightness(.85);opacity:.35}
.mini span{position:relative;font-size:18px}
.gacha{position:fixed;inset:0;z-index:7000;background:radial-gradient(circle at 50% 40%,#5b4a7a,#231a33 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#fff;overflow:hidden}
.gacha .hint2{font-size:15px;opacity:.85;min-height:22px;text-align:center}
.pack{position:relative;width:min(54vw,230px);aspect-ratio:594/968;cursor:pointer;transition:transform .6s cubic-bezier(.5,-0.4,.6,1.4),opacity .5s}
.pack .pbody{position:absolute;inset:0;background:url(assets/pack.webp) center/100% 100% no-repeat;clip-path:inset(12% 0 0 0);display:flex;align-items:flex-start;justify-content:center;overflow:hidden;filter:drop-shadow(0 10px 20px rgba(0,0,0,.4))}

.pack .pbody::before{content:"";position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.45) 50%,transparent 60%);animation:shine 2.6s linear infinite}

.pack .ptop{position:absolute;inset:0;background:url(assets/pack.webp) center/100% 100% no-repeat;clip-path:inset(0 0 88% 0);transform-origin:100% 12%;transition:transform .55s ease-in,opacity .55s}
.pack .logo{font-size:clamp(26px,8vw,36px);letter-spacing:2px;text-shadow:0 3px 0 rgba(120,50,80,.45);position:relative}
.pack .sub{font-size:13px;opacity:.95;position:relative}
.pack .paw{font-size:44px;position:relative}
.pack.shake{animation:shake .45s ease-in-out 2}

.pack.torn .ptop{transform:translate(30%,-40%) rotate(24deg);opacity:0}
.pack.gone{transform:translateY(120%) scale(.9);opacity:0}
.card{position:absolute;width:min(58vw,240px);aspect-ratio:5/7;perspective:900px;cursor:pointer;transform:translateY(30%) scale(.8);opacity:0;transition:transform .7s cubic-bezier(.2,1.4,.4,1),opacity .4s}
.card.up{transform:none;opacity:1}
.card .in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,1.3,.5,1)}
.card.flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.back{background:url(assets/card_back.webp) center/cover;border:4px solid #fff;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.front{transform:rotateY(180deg);background:#fff;border:6px solid var(--rc);box-shadow:0 0 0 2px rgba(255,255,255,.5),0 0 40px var(--glow);display:flex;flex-direction:column}
.front .art{flex:1;position:relative;font-size:clamp(70px,24vw,104px)}
.front .cap{background:var(--rc);color:#fff;text-align:center;padding:8px 6px 10px}
.front .cap b{display:block;font-weight:normal;font-size:12px;letter-spacing:2px;opacity:.95}
.front .cap span{font-size:20px}
.rays{position:absolute;width:160vmax;height:160vmax;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.08) 0 10deg,transparent 10deg 20deg);animation:spin 18s linear infinite;opacity:0;transition:opacity .8s;pointer-events:none}
.rays.on{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}
.gbtns{display:flex;gap:10px;min-height:48px;opacity:0;transition:opacity .4s}
.gbtns.on{opacity:1}
.gbtns button{border:0;border-radius:14px;padding:12px 18px;font-size:16px;background:#fff;color:var(--ink)}
.gbtns .primary{background:var(--accent);color:#fff}
.stage-area{position:relative;width:100%;display:flex;align-items:center;justify-content:center;min-height:min(82vw,350px)}
.sp{position:absolute;font-size:22px;pointer-events:none;animation:pop 1.2s ease-out forwards}

async function api(action,payload){
  // 最多等 30 秒（上傳照片 60 秒），不會一直卡在「處理中」
  const ac=typeof AbortController!=='undefined'?new AbortController():null,tm=ac&&setTimeout(()=>ac.abort(),action==='upload'?60000:30000);let res;
  try{res=await fetch(API_URL,{method:'POST',body:JSON.stringify(Object.assign({action},payload||{})),signal:ac?ac.signal:undefined})}
  catch(e){if(e&&e.name==='AbortError')throw new Error('小島回應太慢了，等一下再試一次');throw e}finally{clearTimeout(tm)}
  const j=await res.json();if(!j.ok)throw new Error(j.error||'連線失敗');return j.data;
}

const PROMPT_BODY=p=>`請參考我附的寵物照片，把牠畫成 3D 黏土質感的 Q 版遊戲角色，保留牠的毛色、花紋和特徵。${p.species?`（牠是一隻${p.species}${p.breed?'，品種是'+p.breed:''}）`:''}

【姿勢】
- 全身入鏡，包括耳朵、四隻腳和尾巴，不能被切到
- 站姿，身體朝向畫面右邊、臉微微轉向前方（3/4 側面）
- 頭大身體小的 Q 版比例，大眼睛、表情可愛

【背景（很重要）】
- 背景必須是純綠色 #00FF00，整片均勻，不要漸層
- 不要地板、不要陰影、不要任何其他物件
- 寵物身上不要有綠色

【規格】
- 正方形 1:1
- 寵物置中，腳底在畫面約 90% 高度的位置，四周留一點空白
- 不要任何文字`;
async function fileToImg(file){const url=URL.createObjectURL(file);try{return await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url})}finally{setTimeout(()=>URL.revokeObjectURL(url),1000)}}
async function makeHead(file){
  const img=await fileToImg(file);const side=Math.min(img.width,img.height),c=document.createElement('canvas');c.width=c.height=240;
  c.getContext('2d').drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,240,240);return c.toDataURL('image/jpeg',0.82);
}
async function makeBody(file){
  const img=await fileToImg(file);const W=Math.min(900,img.width),H=Math.round(img.height*W/img.width);
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.drawImage(img,0,0,W,H);
  const d=x.getImageData(0,0,W,H),a=d.data;
  // 判斷：已透明？綠底？其他底色？
  let tr=0,gr=0,cn=0;const corners=[[2,2],[W-3,2],[2,H-3],[W-3,H-3],[W>>1,2]];
  for(const [cx,cy] of corners){const i=(cy*W+cx)*4;cn++;if(a[i+3]<30)tr++;else if(a[i+1]>150&&a[i+1]-Math.max(a[i],a[i+2])>70)gr++}
  let mode='none';
  if(tr>=3)mode='alpha';else if(gr>=3){mode='green';
    for(let i=0;i<a.length;i+=4){const r=a[i],g=a[i+1],b=a[i+2],m=Math.max(r,b),k=(g-m)/255;
      let al=1-(k-0.12)/0.2;al=Math.max(0,Math.min(1,al));a[i+3]=Math.round(a[i+3]*al);if(g>m)a[i+1]=Math.min(g,m+6)}
    x.putImageData(d,0,0)}
  // 裁掉透明邊
  const d2=x.getImageData(0,0,W,H).data;let x0=W,y0=H,x1=0,y1=0;
  for(let yy=0;yy<H;yy+=2)for(let xx=0;xx<W;xx+=2){if(d2[(yy*W+xx)*4+3]>40){if(xx<x0)x0=xx;if(xx>x1)x1=xx;if(yy<y0)y0=yy;if(yy>y1)y1=yy}}
  if(x1<=x0||y1<=y0){x0=0;y0=0;x1=W-1;y1=H-1}
  const cw=x1-x0+1,ch=y1-y0+1,OW=420,OH=Math.round(ch*OW/cw),o=document.createElement('canvas');o.width=OW;o.height=OH;
  o.getContext('2d').drawImage(c,x0,y0,cw,ch,0,0,OW,OH);
  let url=o.toDataURL('image/webp',0.85);if(!url.startsWith('data:image/webp'))url=o.toDataURL('image/png');
  return {url,mode};
}

function sparkline(ws){
  ws=ws.slice().sort((a,b)=>a.date.localeCompare(b.date)).slice(-12);
  if(ws.length<2)return '';
  const W=300,H=90,P=16,v=ws.map(w=>w.kg),pad=Math.max(0.05,(Math.max(...v)-Math.min(...v))*0.2),mn=Math.min(...v)-pad,mx=Math.max(...v)+pad;
  const X=i=>P+(W-2*P)*i/(ws.length-1),Y=x=>H-P-(H-2*P)*(x-mn)/(mx-mn),L=ws.length-1;
  const d=ws.map((w,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(w.kg).toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="體重變化">
    <path d="${d} L${X(L)} ${H-P} L${X(0)} ${H-P} Z" style="fill:color-mix(in srgb,var(--cc,#ff9a6b) 22%,#fff)"/><path d="${d}" style="fill:none;stroke:var(--cc,#ff9a6b)" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="${X(L)}" cy="${Y(ws[L].kg)}" r="4" style="fill:var(--cc,#ff9a6b)"/>
    <text x="${X(0)}" y="${H-2}" font-size="10" fill="#a08670">${ws[0].date.slice(0,7)}</text><text x="${X(L)}" y="${H-2}" font-size="10" fill="#a08670" text-anchor="end">${ws[L].date.slice(0,7)}</text>
    <text x="${X(L)-6}" y="${Y(ws[L].kg)-8}" font-size="12" fill="#5a4030" text-anchor="end">${ws[L].kg} kg</text></svg>`;
}
const money=n=>'$'+Math.round(n||0).toLocaleString('en-US');

function daysBack(n){const out=[],t=Date.now();for(let i=n-1;i>=0;i--)out.push(twDay(t-i*86400e3));return out}
function trackerBlock(p,t,fam){
  const logs=tlogsOf(p.id,t.id),T=todayTW();
  let body='';
  if(t.type==='num'){const ws=logs.map(l=>({date:l.date,kg:+l.value})).sort((a,b)=>b.date.localeCompare(a.date));
    body=(ws.length>1?sparkline(ws).replace(/ kg</g,` ${esc(t.unit||'')}<`):'')+(ws.length?ws.slice(0,5).map(w=>{const l=logs.find(x=>x.date===w.date&&+x.value===w.kg);return `<div class="rec"><div class="d">${esc(w.date)}</div><div class="t"></div><div class="v">${w.kg} ${esc(t.unit||'')}</div>${fam&&l?`<button class="x" data-tl="${l.id}">刪除</button>`:''}</div>`}).join(''):'<div class="locked">還沒有紀錄</div>')}
  if(t.type==='check'){const set=new Set(logs.map(l=>l.date)),days=daysBack(14);let streak=0;for(let i=days.length-1;i>=0;i--){if(set.has(days[i]))streak++;else if(days[i]!==T)break}
    body=`<div class="chk">${days.map(d=>`<span class="${set.has(d)?'on':''}${d===T?' today':''}" title="${d}">${+d.slice(8)}</span>`).join('')}</div><div class="hint">${streak?`連續 ${streak} 天 🔥`:'最近 14 天'}</div>`}
  if(t.type==='count'){const days=daysBack(7),cnt=d=>logs.filter(l=>l.date===d).reduce((a,l)=>a+(+l.value||1),0),mx=Math.max(1,...days.map(cnt));

  const act=!fam?`<span>${t.vis==='family'?'🔒 家人限定':'公開'}</span>`:t.type==='num'?`<button data-tadd="${t.id}">＋ 記錄</button>`:t.type==='check'?`<button data-tchk="${t.id}">${logs.some(l=>l.date===T)?'✅ 今天完成':'☐ 今天打勾'}</button>`:`<button data-tcnt="${t.id}">＋1 次</button>`;

async function addTLog(p,t,value,date){

function gBlocked(){const G=gG(),o=new Set();for(let r=0;r<GR;r++)for(let c=0;c<GC;c++){const y=gRowY(r+.5),x=gX(y,(c+.5)/GC);if(G.x.some(q=>x>=q[0]&&x<=q[2]&&y>=q[1]&&y<=q[3]))o.add(r+','+c)}return o}
function gCell(x,y){const G=gG(),r=clamp(Math.floor((y-G.y0)/(G.y1-G.y0)*GR),0,GR-1),yc=gRowY(r+.5),L=gX(yc,0),Rr=gX(yc,1);return {r,c:clamp(Math.floor((x-L)/(Rr-L)*GC),0,GC-1)}}
const gSpan=item=>WIDE[item]?2:1;
function gCells(t){const n=gSpan(t.item);if(n===1){const a=gCell(t.x,t.y-8);return [[a.r,a.c]]}const yc=gRowY(gCell(t.x,t.y-8).r+.5),w=(gX(yc,1)-gX(yc,0))/GC,a=gCell(t.x-w/2,t.y-8);return [[a.r,a.c],[a.r,Math.min(GC-1,a.c+1)]]}
function gOcc(h,except){const o=new Set();(h.toys||[]).forEach(t=>{if(t===except)return;gCells(t).forEach(([r,c])=>o.add(r+','+c))});return o}
function gSpot(r,c,n){const y=gRowY(r+0.85),L=gX(y,0),w=(gX(y,1)-L)/GC;return {x:Math.round(L+w*(c+n/2)),y:Math.round(y)}}
const gPoly=(r,c,n)=>{const y0=gRowY(r),y1=gRowY(r+1);return [[gX(y0,c/GC),y0],[gX(y0,(c+n)/GC),y0],[gX(y1,(c+n)/GC),y1],[gX(y1,c/GC),y1]].map(q=>q.map(Math.round).join(',')).join(' ')};
function drawGrid(){const f=$('#floor');if(!f||!placing||!home)return;const h=house(home.id),occ=gOcc(h,placing.toy);let p='';
  const blk=gBlocked();for(let r=0;r<GR;r++)for(let c=0;c<GC;c++)p+=`<polygon points="${gPoly(r,c,1)}" class="${blk.has(r+','+c)?'blk':occ.has(r+','+c)?'occ':''}"/>`;
  const g=document.createElement('div');g.className='ggrid';g.innerHTML=`<svg viewBox="0 0 ${RW} ${RH}" preserveAspectRatio="none">${p}<polygon id="gfl" points="" class="bad"/></svg>`;f.appendChild(g);
  if(!$('#gcancel')){const b=document.createElement('button');b.id='gcancel';b.className='gcancel';b.textContent='✕ 取消擺放';b.onclick=e=>{e.stopPropagation();placing=null;b.remove();renderFloor()};$('#home').appendChild(b)}}
function gFlash(r,c,n){const p=$('#gfl');if(!p)return;p.setAttribute('points',gPoly(r,c,n));p.classList.remove('on');void p.getBoundingClientRect();p.classList.add('on')}

  const h=house(home.id),P=placing,n=gSpan(P.toy?P.toy.item:P.item);let {r,c}=gCell(x,y);if(n===2&&c>GC-2)c=GC-2;

  const tmp={id:'tmp'+uid(),item:P.item,x:Math.round(x),y:Math.round(y)};if(!P.free)bagAdd(P.item,-1);(h.toys=h.toys||[]).push(tmp);renderFloor();toast('擺好了 🧸');
  const tp=toyPend(h.id);tp.add.push(tmp);

const xpNeed=lv=>100+20*(Math.max(1,+lv||1)-1);
function reward(k,mult){
  const e=REW[k];if(!e)return false;const g=DB.game,d=todayTW();
  dmTick(k);
  if(!g.rd||g.rd.d!==d)g.rd={d};const n=g.rd[k]||0;let bx=e.x,bc=e.c;if(e.cap&&n>=e.cap){if(!e.after)return false;bx=e.after.x;bc=e.after.c}g.rd[k]=n+1;
  const dm=DB.dbl===todayTW()?2:1,x=bx*(mult||1)*dm,c=capCoins(bc*(mult||1)*dm);if(!x&&!c)return true;g.xp=(g.xp||0)+x;g.coins=(g.coins||0)+c;g.lv=g.lv||1;let up=0;
  while(g.xp>=xpNeed(g.lv)){g.xp-=xpNeed(g.lv);g.lv++;g.tickets++;up++}
  save();updTix();rewardPop(x,c);
  if(up)setTimeout(()=>{toast(`🎉 升到 Lv.${g.lv}！送你 ${up} 張抽卡券 🎟️`);sfx('levelup')},900);
  return true;
}

const COIN_CAP=150;
function capCoins(c){if(!(c>0))return c||0;const g=DB.game,d=todayTW();if(!g.cc||g.cc.d!==d)g.cc={d,n:0};const ok=Math.max(0,Math.min(c,COIN_CAP-g.cc.n));g.cc.n+=ok;
  if(ok<c&&!g.cc.w){g.cc.w=1;setTimeout(()=>toast(`今天互動賺的金幣到上限 ${COIN_CAP} 了，明天再來～（愛心值照樣加）`),1300)}return ok}
function earn(k){return reward(k)}
function rewardPop(x,c){if(!x&&!c)return;if(c)sfx('coin');if(flyReward(x,c))return;const el=document.createElement('div');el.className='coinpop';el.textContent=`${x?`+${x} 💗`:''}${c?` +${c} 🪙`:''}`;document.body.appendChild(el);setTimeout(()=>el.remove(),1500)}

function rollPack(h){
  const g=DB.game,own=owned(h.id),left=CARDS.filter(c=>c.r!=='H'&&!own.has(c.id));g.pity=(g.pity||0)+1;
  let type;
  if(g.pity>=10)type=left.length?'room':'limited';
  else{const w={treat:50,toy:30,room:left.length?15:0,limited:5,acc:accLeft(h.id).length?12:0};let x=Math.random()*Object.values(w).reduce((a,b)=>a+b,0);for(const k in w){if((x-=w[k])<0){type=k;break}}}
  if(type==='room'){g.pity=0;const avail=Object.keys(RAR).filter(r=>left.some(c=>c.r===r));let x=Math.random()*avail.reduce((a,r)=>a+RAR[r].w,0),r=avail[0];for(const k of avail){if((x-=RAR[k].w)<0){r=k;break}}
    const pool=left.filter(c=>c.r===r);return {type,card:pool[Math.floor(Math.random()*pool.length)]}}
  const pick=f=>{const ids=Object.keys(ITEMS).filter(id=>f(ITEMS[id]));return ids[Math.floor(Math.random()*ids.length)]};
  if(type==='acc'){const L=accLeft(h.id);return {type,acc:L[Math.floor(Math.random()*L.length)]}}
  if(type==='treat')return {type,items:[0,1,2].map(()=>pick(i=>i.kind==='treat'&&!i.bday))};
  if(type==='toy')return {type,items:[pick(i=>i.kind==='toy'&&!i.limited)]};
  if(left.length===0&&g.pity>=10)g.pity=0;
  return {type:'limited',items:[pick(i=>i.limited)]};
}

// ================= ⭐ 星寶活動：毛球的星寶（v1.64） =================
// 島主在後台按「開始」後兩週；每個人各自算：星寶一天 4 個時段出現、每人每天最多找到 3 次（不告訴玩家）、集滿 10 次去找毛球
const NXT='<img class="mic" src="assets/icon_next.webp" alt="">下一句',STAR_GOAL=10,STAR_DAY_MAX=3,STAR_WIN_H=1.5,STAR_SEGS=[[7,11],[12,16],[18,22],[22.5,27]],MQ_EVERY=30*60000,STAR_ROOM='starhouse',STAR_COINS=500;
function starEv(){const s=DB.star;if(!s||!+s.start)return null;const end=+s.end||(+s.start+14*864e5),now=Date.now();return {start:+s.start,end,on:now>=+s.start&&now<end}}
function starG(){const g=DB.game;if(!g.star||typeof g.star!=='object')g.star={n:0,day:'',dn:0,got:[],met:false,done:false};if(!Array.isArray(g.star.got))g.star.got=[];return g.star}
const starDone=()=>!!(starG().done||DB.starDone);
const gameDay=t=>twDay(t-4*HOUR);   // 島上的一天從早上 4 點開始
function dayBase(key){const [y,m,d]=key.split('-').map(Number);return Date.UTC(y,m-1,d)-TWO}
function starWindows(key){const b=dayBase(key);return STAR_SEGS.map(([a,z],i)=>{const st=a+hash01(key+'sw'+i)*(z-a-STAR_WIN_H);return {id:key+'#'+i,s:b+st*HOUR,e:b+(st+STAR_WIN_H)*HOUR}})}
const starWin=now=>starWindows(gameDay(now)).find(w=>now>=w.s&&now<w.e)||null;
function starToday(){const s=starG(),k=gameDay(Date.now());if(s.day!==k){s.day=k;s.dn=0}return s}
function starHouses(){const mine=DB.me&&DB.me.houseId;return DB.houses.filter(h=>!isSpecialH(h)&&h.id!==mine).map(h=>h.id).sort()}
const starCan=()=>{const E=starEv();return !!(E&&E.on&&DB.me&&myHouse()&&!starDone())};

let HUDV=null,hudHold=0,hudT=null;
function updHud(){const g=DB.game||{},T={coins:g.coins||0,xp:g.xp||0,lv:g.lv||1};
  if(!DB.me){document.querySelectorAll('.hud').forEach(h=>h.style.display='none');return}
  const F=HUDV||T;document.querySelectorAll('.hud').forEach(h=>{h.style.display='';h.innerHTML=hudHTML(F)});

  clearTimeout(hudT);hudT=setTimeout(()=>{const t0=performance.now(),D=500,from={...HUDV};HUDV=T;
    document.querySelectorAll('.hud').forEach(h=>{if(T.lv!==from.lv){h.innerHTML=hudHTML(T);h.classList.add('lvup');setTimeout(()=>h.classList.remove('lvup'),900);return}

      if(T.xp!==from.xp){const c=h.querySelector('.xpw');c.classList.remove('bump');void c.offsetWidth;c.classList.add('bump')}});

  if(actx.state!=='running'){try{actx.resume().then(()=>{for(const k in SQ){if(Date.now()-SQ[k]<800&&SBUF[k]){delete SQ[k];sfx(k)}}},()=>{})}catch(e){}}

function situation(r,p){const h=house(home.id),hr=+new Date(Date.now()+8*3600e3).getUTCHours(),c=[];

    if(moved||e.changedTouches.length!==1||e.target.closest('.irows,.izreset,.camtop'))return;
    const t=e.changedTouches[0],n=Date.now();
    if(n-lastTap<320&&lastTapXY&&Math.hypot(t.clientX-lastTapXY[0],t.clientY-lastTapXY[1])<40){e.preventDefault();lastTap=0;const[cx,cy]=loc(t.clientX,t.clientY);if(s>1.02)islandZoomReset(true);else zoomAt(2,cx,cy,true)}
    else{lastTap=n;lastTapXY=[t.clientX,t.clientY]}},{passive:false});
  map.addEventListener('click',e=>{if(moved){e.stopPropagation();e.preventDefault();moved=false}},true);
  map.addEventListener('wheel',e=>{if(e.target.closest('.irows,.camtop'))return;e.preventDefault();const[cx,cy]=loc(e.clientX,e.clientY);zoomAt(s*(e.deltaY<0?1.15:1/1.15),cx,cy)},{passive:false});
  map.addEventListener('dblclick',e=>{if(e.target.closest('.irows,.izreset,.camtop'))return;const[cx,cy]=loc(e.clientX,e.clientY);if(s>1.02)islandZoomReset(true);else zoomAt(2,cx,cy,true)});
  // 超過 5 分鐘沒碰，回到小島時還原
  const chk=()=>{if(s>1.02&&Date.now()-last>5*60e3)islandZoomReset(false)};
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)chk()});
  $('#back').addEventListener('click',chk);
  addEventListener('resize',()=>apply())})();

  $('#lgb').onclick=back;
  $('#lgdel').onclick=e=>{if(!armBtn(e.target,'確定刪除？'))return;LGONE[id]=1;DB.letters=DB.letters.filter(x=>x.id!==id);updBell();toast('信刪掉了');back();if(ONLINE)call('hideLetter',{playerId:DB.me.id,letterId:id},true).catch(()=>{})};
  if($('#lgclaim'))$('#lgclaim').onclick=()=>{const G=DB.game;if(l.claimed||CLAIMED['l:'+id]){l.claimed=true;toast('這封信的禮物已經領過了');return openLetter(id,back)}markClaimed('l:'+id);l.claimed=true;LSTATE[id]=Object.assign(LSTATE[id]||{},{claimed:true});
    if(+l.tickets)G.tickets=(G.tickets||0)+ +l.tickets;if(l.item&&ITEMS[l.item]&&+l.n)bagAdd(l.item,+l.n);if(l.room&&myHouse()){const hid=myHouse().id,own=new Set(DB.owned[hid]||[]);own.add(l.room);DB.owned[hid]=[...own]}const b=$('#lgclaim').getBoundingClientRect();grant(0,+l.coins||0,{x:b.left+b.width/2,y:b.top});save();updTix();sfx('gift');
    toast(`領到了：${g.join('、')} 🎉`);openLetter(id,back);
    call('claimLetter',{playerId:DB.me.id,letterId:id},true).catch(e=>{const dup=/領過/.test(e.message);if(!dup){l.claimed=false;delete LSTATE[id].claimed;delete CLAIMED['l:'+id]}G.coins=Math.max(0,(G.coins||0)-(+l.coins||0));if(+l.tickets)G.tickets-= +l.tickets;if(l.item&&+l.n)bagAdd(l.item,-l.n);save();updTix();toast(dup?'這封信的禮物之前已經領過了，剛剛的先收回喔':'領取沒成功：'+e.message)})}}
// 有新信時跳出提示（每封只跳一次）
function announceLetters(){if(!DB.me)return;let seen=[];try{seen=JSON.parse(localStorage.getItem('mhd_lgseen')||'[]')}catch(e){}
  const nw=(DB.letters||[]).filter(l=>!l.read&&!seen.includes(l.id));if(!nw.length)return;
  const go=()=>{if(!$('#modal').classList.contains('hidden'))return setTimeout(go,2500);try{localStorage.setItem('mhd_lgseen',JSON.stringify(seen.concat(nw.map(l=>l.id)).slice(-100)))}catch(e){}
    openModal(`<div style="text-align:center"><div class="lgpop"><img src="assets/icon_mail_admin.webp" alt="" onerror="this.replaceWith('✉️')"></div><h3>你有 ${nw.length>1?nw.length+' 封':'一封'}島主的信 ✉️</h3><p class="lead">${esc(nw[0].title)}</p></div>
      <div class="row2"><button data-close>等等再看</button><button class="primary" id="lgopen">打開看看</button></div>`);
    sfx('gift');$('#lgopen').onclick=()=>openLetter(nw[0].id,()=>$('#bell').click())};
  setTimeout(go,1800)}
// ================= 自動更新：發現新版本就重新載入 =================
const APP_VER='v1.70';
function checkUpdate(){
  if(!/^https?:/.test(location.protocol)||!API_URL)return;
  if(!$('#modal').classList.contains('hidden'))return; // 正在填表單時不打斷
  fetch('./index.html?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(t=>{
    const m=t.match(/const APP_VER='([^']+)'/);if(!m||m[1]===APP_VER)return;
    try{if(sessionStorage.getItem('mhd_upd')===m[1])return;sessionStorage.setItem('mhd_upd',m[1])}catch(e){}
    location.replace(location.pathname+'?v='+encodeURIComponent(m[1]));
  }).catch(()=>{})}
setTimeout(checkUpdate,2000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate()});
</script>
